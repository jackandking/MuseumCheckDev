<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>宠物贪食蛇 - MuseumCheck</title>
    <meta name="description" content="经典贪食蛇游戏，使用你的虚拟宠物作为主角！宠物等级越高体验越爽！">
    
    <!-- Baidu Analytics -->
    <script>
        var _hmt = _hmt || [];
        (function() {
            var hm = document.createElement("script");
            hm.src = "https://hm.baidu.com/hm.js?10856afa2ea23687b7e8f5b901795c57";
            var s = document.getElementsByTagName("script")[0]; 
            s.parentNode.insertBefore(hm, s);
        })();
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        #gameContainer {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 10px;
        }
        
        #gameCanvas {
            display: block;
            background: rgba(0, 0, 0, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
        
        .game-header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 10px;
        }
        
        .back-link {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }
        
        .back-link:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .game-info {
            display: flex;
            gap: 20px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 10;
            border-radius: 12px;
        }
        
        .screen-overlay.hidden {
            display: none;
        }
        
        .screen-title {
            font-size: 48px;
            color: #FFD700;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            animation: pulse 2s infinite;
        }
        
        .screen-subtitle {
            font-size: 18px;
            color: #fff;
            margin-bottom: 10px;
            text-align: center;
            padding: 0 20px;
        }
        
        .pet-display {
            font-size: 64px;
            margin: 20px 0;
            animation: bounce 1s infinite;
        }
        
        .level-badge {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
        }
        
        .screen-button {
            padding: 15px 40px;
            font-size: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        .screen-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }
        
        .screen-stats {
            color: #fff;
            font-size: 18px;
            margin: 15px 0;
            text-align: center;
        }
        
        .xp-reward {
            color: #FFD700;
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .controls-hint {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-top: 20px;
            text-align: center;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        /* Mobile optimizations */
        @media (max-width: 768px) {
            .screen-title {
                font-size: 36px;
            }
            
            .screen-subtitle {
                font-size: 16px;
            }
            
            .pet-display {
                font-size: 48px;
            }
            
            .screen-button {
                padding: 12px 30px;
                font-size: 18px;
            }
            
            .game-info {
                font-size: 14px;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="game-header">
            <a href="index.html" class="back-link">← 返回主页</a>
            <div class="game-info">
                <span>🏆 分数: <span id="scoreDisplay">0</span></span>
                <span>📏 长度: <span id="lengthDisplay">1</span></span>
            </div>
        </div>
        
        <canvas id="gameCanvas"></canvas>
        
        <!-- Start Screen -->
        <div id="startScreen" class="screen-overlay">
            <div class="screen-title">🐍 宠物贪食蛇</div>
            <div class="pet-display" id="petDisplayStart">🐾</div>
            <div class="level-badge" id="levelBadgeStart">载入中...</div>
            <div class="screen-subtitle">使用你的虚拟宠物吃掉所有食物！<br>宠物等级越高，游戏体验越爽！</div>
            <button class="screen-button" onclick="startGame()">🎮 开始游戏</button>
            <div class="controls-hint">
                💻 电脑：方向键控制<br>
                📱 手机：滑动屏幕控制
            </div>
        </div>
        
        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="screen-overlay hidden">
            <div class="screen-title">游戏结束</div>
            <div class="pet-display" id="petDisplayEnd">🐾</div>
            <div class="screen-stats">
                🏆 最终分数: <span id="finalScore">0</span><br>
                📏 蛇的长度: <span id="finalLength">0</span><br>
                🍎 吃掉食物: <span id="foodEaten">0</span>
            </div>
            <div class="xp-reward" id="xpReward">+0 XP</div>
            <button class="screen-button" onclick="restartGame()">🔄 再玩一次</button>
            <button class="screen-button" onclick="window.history.back()">继续游览 ➡️</button>
        </div>
    </div>
    
    <script src="snake-game.js"></script>
</body>
</html>
