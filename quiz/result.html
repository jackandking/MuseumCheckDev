<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>答题结果 - 考一考</title>
    <script src="../js/debug-mode.js"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/global-ui.css">
    <link rel="stylesheet" href="css/quiz-style.css">
    <style>
        .result-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        .result-card {
            background: white;
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: var(--quiz-shadow-lg);
            text-align: center;
        }

        .result-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 0.5s ease;
        }

        .result-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--quiz-text);
        }

        .result-subtitle {
            font-size: 18px;
            color: var(--quiz-text-light);
            margin-bottom: 32px;
        }

        .result-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .result-stat {
            background: var(--quiz-bg);
            padding: 24px;
            border-radius: 12px;
        }

        .result-stat-label {
            display: block;
            font-size: 14px;
            color: var(--quiz-text-light);
            margin-bottom: 8px;
        }

        .result-stat-value {
            display: block;
            font-size: 32px;
            font-weight: 700;
            color: var(--quiz-primary);
        }

        .result-stat-value.large {
            font-size: 40px;
        }

        .result-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .result-btn {
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .result-btn.primary {
            background: var(--quiz-primary);
            color: white;
        }

        .result-btn.primary:hover {
            background: var(--quiz-primary-hover);
        }

        .result-btn.secondary {
            background: white;
            color: var(--quiz-text);
            border: 2px solid var(--quiz-border);
        }

        .result-btn.secondary:hover {
            background: var(--quiz-bg);
        }

        .achievement-unlocked {
            background: linear-gradient(135deg, var(--quiz-primary) 0%, #667eea 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 24px;
            animation: fadeIn 0.5s ease;
        }

        .achievement-unlocked h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
        }

        .achievement-unlocked p {
            margin: 0;
            font-size: 14px;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .result-container {
                margin: 20px;
                padding: 12px;
            }

            .result-card {
                padding: 30px 20px;
            }

            .result-icon {
                font-size: 64px;
            }

            .result-title {
                font-size: 26px;
            }

            .result-stats {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .result-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="result-container">
        <div class="result-card">
            <div class="result-icon" id="resultIcon">🏆</div>
            <h1 class="result-title" id="resultTitle">太棒了！</h1>
            <p class="result-subtitle" id="resultSubtitle">继续保持，你的表现很出色！</p>

            <div class="result-stats">
                <div class="result-stat">
                    <span class="result-stat-label">答对题目</span>
                    <span class="result-stat-value" id="correctCount">0</span>
                </div>
                <div class="result-stat">
                    <span class="result-stat-label">总题数</span>
                    <span class="result-stat-value" id="totalCount">0</span>
                </div>
                <div class="result-stat">
                    <span class="result-stat-label">正确率</span>
                    <span class="result-stat-value large" id="accuracy">0%</span>
                </div>
                <div class="result-stat">
                    <span class="result-stat-label">获得积分</span>
                    <span class="result-stat-value large" id="points">0</span>
                </div>
            </div>

            <div class="result-actions">
                <button class="result-btn primary" onclick="goToQuizHome()">继续答题</button>
                <button class="result-btn secondary" onclick="goHome()">返回首页</button>
            </div>

            <div id="achievementContainer"></div>
        </div>
    </div>

    <script src="js/points-manager.js"></script>
    <script src="js/quiz-ui.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            displayResults();
        });

        function displayResults() {
            const params = new URLSearchParams(window.location.search);
            const correct = parseInt(params.get('correct')) || 0;
            const total = parseInt(params.get('total')) || 0;
            const accuracy = parseFloat(params.get('accuracy')) || 0;
            const points = parseInt(params.get('points')) || 0;
            const streak = parseInt(params.get('streak')) || 0;
            const duration = parseInt(params.get('duration')) || 0;

            // Update stats
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('accuracy').textContent = accuracy + '%';
            document.getElementById('points').textContent = points;

            // Determine result icon and title based on accuracy
            let icon = '🏆';
            let title = '太棒了！';
            let subtitle = '继续保持，你的表现很出色！';

            if (accuracy >= 90) {
                icon = '🏆';
                title = '完美表现！';
                subtitle = '你简直是博物馆小专家！';
            } else if (accuracy >= 75) {
                icon = '👏';
                title = '很棒！';
                subtitle = '你对博物馆知识掌握得很好！';
            } else if (accuracy >= 60) {
                icon = '💪';
                title = '不错！';
                subtitle = '继续努力，你会更棒的！';
            } else {
                icon = '📚';
                title = '加油！';
                subtitle = '多复习一下，下次一定能做得更好！';
            }

            document.getElementById('resultIcon').textContent = icon;
            document.getElementById('resultTitle').textContent = title;
            document.getElementById('resultSubtitle').textContent = subtitle;

            // Check for achievements
            checkAchievements(correct, total, accuracy, streak);

            // Animate numbers
            animateNumbers();
        }

        function animateNumbers() {
            const correctEl = document.getElementById('correctCount');
            const totalEl = document.getElementById('totalCount');
            const accuracyEl = document.getElementById('accuracy');
            const pointsEl = document.getElementById('points');

            QuizUI.animateNumber(correctEl, parseInt(correctEl.textContent), 1000);
            QuizUI.animateNumber(totalEl, parseInt(totalEl.textContent), 1000);
            
            setTimeout(() => {
                const accuracyValue = parseFloat(accuracyEl.textContent);
                let current = 0;
                const timer = setInterval(() => {
                    current += accuracyValue / 30;
                    if (current >= accuracyValue) {
                        accuracyEl.textContent = accuracyValue.toFixed(1) + '%';
                        clearInterval(timer);
                    } else {
                        accuracyEl.textContent = current.toFixed(1) + '%';
                    }
                }, 33);
            }, 500);

            setTimeout(() => {
                QuizUI.animateNumber(pointsEl, parseInt(pointsEl.textContent), 1000);
            }, 1000);
        }

        function checkAchievements(correct, total, accuracy, streak) {
            const container = document.getElementById('achievementContainer');
            const achievements = [];

            // Perfect score
            if (accuracy === 100) {
                achievements.push({
                    title: '🎯 完美答题！',
                    description: '全部答对，一题不错！'
                });
            }

            // High streak
            if (streak >= 10) {
                achievements.push({
                    title: '🔥 连胜高手！',
                    description: `连对${streak}题，太厉害了！`
                });
            }

            // Fast completion (if duration < 2 minutes)
            const duration = parseInt(new URLSearchParams(window.location.search).get('duration')) || 0;
            if (duration > 0 && duration < 120 && total >= 5) {
                achievements.push({
                    title: '⚡ 答题飞侠！',
                    description: '用时不到2分钟完成答题！'
                });
            }

            // Display achievements
            achievements.forEach(achievement => {
                const div = document.createElement('div');
                div.className = 'achievement-unlocked';
                div.innerHTML = `
                    <h3>${achievement.title}</h3>
                    <p>${achievement.description}</p>
                `;
                container.appendChild(div);
            });

            // Show confetti for high scores
            if (accuracy >= 90) {
                QuizUI.showConfetti();
            }
        }

        function goToQuizHome() {
            window.location.href = 'index.html';
        }

        function goHome() {
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
