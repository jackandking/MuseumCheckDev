<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>设置 | MuseumCheck</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Helvetica,Arial; background:#f7f9fb; color:#2c3e50;}
    .wrap{max-width:760px;margin:0 auto;padding:16px}
    .card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:16px;margin-bottom:16px}
    .title{font-size:22px;font-weight:800;margin:4px 0 12px}
    .row{margin:12px 0}
    label{display:block;font-size:14px;margin-bottom:6px;color:#445}
    select{width:100%;padding:12px;border-radius:12px;border:2px solid #dee2e6;font-size:16px}
    .actions{display:flex;gap:10px;margin-top:14px}
    .btn{padding:12px 16px;border:none;border-radius:12px;cursor:pointer;font-size:16px;font-weight:700}
    .btn-primary{background:linear-gradient(135deg,#2c5aa0,#5b8bd9);color:#fff}
    .btn-secondary{background:#eef2f6;color:#2c3e50}
    .hint{font-size:13px;color:#667;margin-top:8px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="title">偏好设置</h1>

    <div class="card">
      <div class="title" style="font-size:18px">孩子信息</div>
      <div class="row">
        <label for="ageGroup">孩子年龄段</label>
        <select id="ageGroup">
          <option value="3-6">3-6 岁（学龄前）</option>
          <option value="7-12">7-12 岁（小学）</option>
          <option value="13-18">13-18 岁（初高中）</option>
        </select>
      </div>
    </div>

    <div class="card">
      <div class="title" style="font-size:18px">陪同者信息</div>
      <div class="row">
        <label for="caregiverRole">陪同者与孩子关系</label>
        <select id="caregiverRole">
          <option value="parent">父母</option>
          <option value="grandparent">祖父母</option>
          <option value="relative">其他亲属</option>
          <option value="teacher">老师/带队</option>
        </select>
        <div class="hint">将据此优先推荐更合适的路线与任务.</div>
      </div>
    </div>

    <div class="card">
      <div class="title" style="font-size:18px">AI 功能设置</div>
      <div class="row">
        <label for="deepseekApiKey">DeepSeek API Key</label>
        <input type="password" id="deepseekApiKey" placeholder="输入您的 DeepSeek API Key" style="padding:12px;border-radius:12px;border:2px solid #dee2e6;font-size:16px;width:100%;box-sizing:border-box;" />
        <div class="hint">用于 AI 验证博物馆数据。获取 API Key：<a href="https://platform.deepseek.com" target="_blank" style="color:#2c5aa0">platform.deepseek.com</a></div>
      </div>
    </div>

    <div class="card">
      <div class="title" style="font-size:18px">博物馆数据源优先级</div>
      <div class="row">
        <label for="dataPriority">数据加载优先级</label>
        <select id="dataPriority">
          <option value="tier2-tier1-tier3">远程存储 → 静态文件 → 内置数据（推荐，获取最新数据）</option>
          <option value="tier1-tier2-tier3">静态文件 → 远程存储 → 内置数据（稳定优先）</option>
          <option value="tier3-tier1-tier2">内置数据 → 静态文件 → 远程存储（离线优先）</option>
        </select>
        <div class="hint">
          <strong>远程存储</strong>：动态数据，单馆页面可获取最新内容<br>
          <strong>静态文件</strong>：稳定发布的博物馆数据<br>
          <strong>内置数据</strong>：应用默认数据
        </div>
      </div>
      <div class="row">
        <button id="manageDataBtn" class="btn btn-secondary" style="width:100%">管理远程数据</button>
      </div>
    </div>

    <div class="actions">
      <button id="saveBtn" class="btn btn-primary">保存</button>
      <button id="backBtn" class="btn btn-secondary">返回</button>
    </div>
  </div>

  <script src="museum-data-loader.js"></script>
  <script>
    (function(){
      function load(){
        try{
          const age = localStorage.getItem('ageGroup') || '7-12';
          const role = localStorage.getItem('caregiverRole') || 'parent';
          document.getElementById('ageGroup').value = age;
          document.getElementById('caregiverRole').value = role;
          
          // Load DeepSeek API Key
          const deepseekApiKey = localStorage.getItem('deepseekApiKey') || '';
          document.getElementById('deepseekApiKey').value = deepseekApiKey;
          
          // Load data priority setting
          const prioritySettings = localStorage.getItem('museumDataTierPriority');
          let priorityValue = 'tier2-tier1-tier3'; // default: dynamic data first for single museum pages
          if (prioritySettings) {
            const parsed = JSON.parse(prioritySettings);
            const priority = parsed.priority || ['tier2', 'tier1', 'tier3'];
            priorityValue = priority.join('-');
          }
          document.getElementById('dataPriority').value = priorityValue;
          console.log('Settings loaded. Priority:', priorityValue);
        }catch(e){
          console.error('Error loading settings:', e);
        }
      }
      function save(){
        try{
          const age = document.getElementById('ageGroup').value;
          const role = document.getElementById('caregiverRole').value;
          localStorage.setItem('ageGroup', age);
          localStorage.setItem('caregiverRole', role);
          
          // Save DeepSeek API Key
          const deepseekApiKey = document.getElementById('deepseekApiKey').value.trim();
          if (deepseekApiKey) {
            localStorage.setItem('deepseekApiKey', deepseekApiKey);
          } else {
            localStorage.removeItem('deepseekApiKey');
          }
          
          // Save data priority setting
          const priorityValue = document.getElementById('dataPriority').value;
          const priority = priorityValue.split('-');
          localStorage.setItem('museumDataTierPriority', JSON.stringify({ priority }));
          
          // Update museumDataLoader's in-memory priority to match
          if (window.museumDataLoader && typeof window.museumDataLoader.updatePrioritySettings === 'function') {
            window.museumDataLoader.updatePrioritySettings(priority);
            console.log('Museum data loader priority updated:', priority);
          }
          
          // Clear museum data cache when priority changes so new priority takes effect
          if (window.museumDataLoader && typeof window.museumDataLoader.clearCache === 'function') {
            window.museumDataLoader.clearCache();
            console.log('Museum data cache cleared due to priority change');
          }
          
          alert('设置已保存');
        }catch(e){ 
          console.error('Error saving settings:', e);
          alert('保存失败，请重试'); 
        }
      }
      function back(){
        const ref = document.referrer || 'index.html';
        location.href = ref;
      }
      function manageData(){
        location.href = 'museum-data-manager.html';
      }
      document.getElementById('saveBtn').onclick = save;
      document.getElementById('backBtn').onclick = back;
      document.getElementById('manageDataBtn').onclick = manageData;
      load();
    })();
  </script>
</body>
</html>
