<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首都博物馆数据集成测试</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 { color: #333; border-bottom: 3px solid #4CAF50; padding-bottom: 10px; }
    h2 { color: #555; margin-top: 0; }
    .success { color: #4CAF50; font-weight: bold; }
    .error { color: #f44336; font-weight: bold; }
    .info { background: #e3f2fd; padding: 10px; border-radius: 4px; margin: 10px 0; }
    .collection-item { 
      border-left: 3px solid #2196F3; 
      padding-left: 15px; 
      margin: 10px 0;
    }
    .workflow-item {
      border-left: 3px solid #FF9800;
      padding-left: 15px;
      margin: 10px 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #4CAF50;
      color: white;
    }
  </style>
</head>
<body>
  <h1>🏛️ 首都博物馆数据集成测试</h1>
  
  <div class="card">
    <h2>📊 数据加载状态</h2>
    <div id="loadStatus"></div>
  </div>

  <div class="card">
    <h2>🏺 藏品信息 (Collections)</h2>
    <div id="collections"></div>
  </div>

  <div class="card">
    <h2>🧭 工作流信息 (Workflows)</h2>
    <div id="workflows"></div>
  </div>

  <div class="card">
    <h2>📋 清单统计 (Checklists)</h2>
    <div id="checklists"></div>
  </div>

  <script src="museums-data.js"></script>
  <script src="museums/capital-museum.js"></script>
  <script>
    // Merge logic (same as in HTML files)
    (function(){
      try{
        if(Array.isArray(window.MUSEUMS)){
          var overrides = [];
          if(window.MUSEUM_CAPITAL) overrides.push(window.MUSEUM_CAPITAL);
          overrides.forEach(function(m){
            if(!m || !m.id) return;
            var idx = window.MUSEUMS.findIndex(function(x){ return x && x.id===m.id; });
            if(idx>=0) window.MUSEUMS[idx] = Object.assign({}, window.MUSEUMS[idx], m);
            else window.MUSEUMS.push(m);
          });
        }
      }catch(e){ console.error('Merge error:', e); }
    })();

    // Find the capital museum
    const capitalMuseum = window.MUSEUMS.find(m => m && m.id === 'beijing-capital-museum');
    
    // Display load status
    const loadStatus = document.getElementById('loadStatus');
    if (capitalMuseum) {
      loadStatus.innerHTML = `
        <div class="success">✅ 首都博物馆数据加载成功！</div>
        <div class="info">
          <strong>名称：</strong>${capitalMuseum.name}<br>
          <strong>位置：</strong>${capitalMuseum.location}<br>
          <strong>描述：</strong>${capitalMuseum.description}<br>
          <strong>标签：</strong>${capitalMuseum.tags.join(', ')}
        </div>
      `;
    } else {
      loadStatus.innerHTML = '<div class="error">❌ 首都博物馆数据未找到</div>';
    }

    // Display collections
    const collectionsDiv = document.getElementById('collections');
    if (capitalMuseum && capitalMuseum.collections) {
      let html = `<p>共有 <strong>${capitalMuseum.collections.length}</strong> 个藏品：</p>`;
      capitalMuseum.collections.forEach((item, i) => {
        html += `
          <div class="collection-item">
            <strong>${i+1}. ${item.name}</strong><br>
            ${item.description ? `<small>${item.description}</small><br>` : ''}
            ${item.imageUrl ? `<small>图片链接：<a href="${item.imageUrl}" target="_blank">查看</a></small>` : ''}
          </div>
        `;
      });
      collectionsDiv.innerHTML = html;
    } else {
      collectionsDiv.innerHTML = '<div class="error">无藏品数据</div>';
    }

    // Display workflows
    const workflowsDiv = document.getElementById('workflows');
    if (capitalMuseum && capitalMuseum.workflows) {
      let html = `<p>共有 <strong>${capitalMuseum.workflows.length}</strong> 个工作流：</p>`;
      capitalMuseum.workflows.forEach((wf, i) => {
        html += `
          <div class="workflow-item">
            <strong>${i+1}. ${wf.name}</strong> (ID: ${wf.id})<br>
            <small>描述：${wf.description}</small><br>
            <small>适用年龄：${wf.ages.join(', ')}</small><br>
            <small>任务数量：${wf.tasks.length}</small>
          </div>
        `;
      });
      workflowsDiv.innerHTML = html;
    } else {
      workflowsDiv.innerHTML = '<div class="error">无工作流数据</div>';
    }

    // Display checklists
    const checklistsDiv = document.getElementById('checklists');
    if (capitalMuseum && capitalMuseum.checklists) {
      let html = '<table><tr><th>类型</th><th>3-6岁</th><th>7-12岁</th><th>13-18岁</th></tr>';
      
      const parentCounts = [
        capitalMuseum.checklists.parent?.['3-6']?.length || 0,
        capitalMuseum.checklists.parent?.['7-12']?.length || 0,
        capitalMuseum.checklists.parent?.['13-18']?.length || 0
      ];
      
      const childCounts = [
        capitalMuseum.checklists.child?.['3-6']?.length || 0,
        capitalMuseum.checklists.child?.['7-12']?.length || 0,
        capitalMuseum.checklists.child?.['13-18']?.length || 0
      ];
      
      html += `<tr><td>家长清单</td><td>${parentCounts[0]} 项</td><td>${parentCounts[1]} 项</td><td>${parentCounts[2]} 项</td></tr>`;
      html += `<tr><td>孩子清单</td><td>${childCounts[0]} 项</td><td>${childCounts[1]} 项</td><td>${childCounts[2]} 项</td></tr>`;
      html += '</table>';
      
      checklistsDiv.innerHTML = html;
    } else {
      checklistsDiv.innerHTML = '<div class="error">无清单数据</div>';
    }
  </script>
</body>
</html>
