<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 - 博物馆打卡</title>
    <meta name="robots" content="noindex">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 480px; }
        .emoji { font-size: 80px; margin-bottom: 20px; }
        h1 { font-size: 28px; margin-bottom: 12px; font-weight: 600; }
        p { font-size: 16px; color: #a8b8d8; margin-bottom: 24px; line-height: 1.6; }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: #e94560;
            color: white;
            text-decoration: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(233, 69, 96, 0.4); }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🏛️</div>
        <h1>页面走丢了</h1>
        <p>您访问的页面不存在，可能已被移动或删除。<br>不如回到首页，探索更多博物馆吧！</p>
        <a href="/" class="btn">回到首页</a>
    </div>
</body>
</html>
