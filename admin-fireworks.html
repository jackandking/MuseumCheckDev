<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fireworks 管理后台</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; margin: 16px; color: #111; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .unauthorized { padding: 24px; background: #fff5f5; border: 1px solid #fecaca; color: #991b1b; border-radius: 8px; }
    .panel { border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin-bottom: 16px; background: #fff; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .row > * { margin: 4px 0; }
    button { padding: 8px 12px; border: 1px solid #d1d5db; background: #f9fafb; border-radius: 6px; cursor: pointer; }
    button.primary { background: #2563eb; color: #fff; border-color: #1d4ed8; }
    button.danger { background: #dc2626; color: #fff; border-color: #b91c1c; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; vertical-align: top; }
    th { background: #f9fafb; position: sticky; top: 0; z-index: 1; }
    .tag { display: inline-block; font-size: 12px; padding: 2px 6px; border-radius: 999px; background: #f3f4f6; border: 1px solid #e5e7eb; margin-right: 6px; }
    .tag.error { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
    .tag.ok { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
    .muted { color: #6b7280; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; }
    .flex { display: flex; gap: 8px; align-items: center; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .counts { display: flex; gap: 12px; flex-wrap: wrap; }
    .count { padding: 6px 10px; border-radius: 8px; background: #f3f4f6; border: 1px solid #e5e7eb; }
    .sticky-actions { position: sticky; top: 8px; z-index: 5; background: #fff; padding-bottom: 8px; }
  </style>
</head>
<body>
  <h1>Fireworks 管理后台</h1>
  <div style="margin-bottom: 12px; font-size: 13px; color: #6b7280;">
    其他管理页面: <a href="admin-leaderboard.html?admin=1" style="color: #2563eb; text-decoration: none;">🏅 排行榜管理</a>
  </div>
  <div id="unauthorized" class="unauthorized" style="display:none">
    <div style="font-weight:600; margin-bottom: 6px;">未授权访问</div>
    <div class="muted">请使用 URL 携带参数 <span class="mono">?admin=1</span> 访问此页面。例如：<span class="mono">/admin-fireworks.html?admin=1</span></div>
  </div>

  <div id="app" style="display:none">
    <div class="panel sticky-actions">
      <div class="row">
        <button id="reload" class="primary">重新加载数据</button>
        <button id="deleteSelectedInvalid" class="danger">批量删除不合法（远程+本地）</button>
        <span id="status" class="muted"></span>
      </div>
      <div class="counts" id="counts"></div>
      <div class="row">
        <label>远程保留时间(ms)：<input id="retention" type="number" class="mono" style="width:160px" /></label>
        <button id="saveRetention">保存保留时间</button>
      </div>
    </div>

    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <div style="font-weight:600">远程 Fireworks</div>
        <div class="muted">来源键：<span class="mono">museumcheck-firework</span></div>
      </div>
      <div style="overflow:auto; max-height: 45vh; border:1px solid #eee; border-radius:8px;">
        <table id="remoteTable">
          <thead>
            <tr>
              <th style="width: 220px;">ID</th>
              <th>信息</th>
              <th style="width: 200px;">校验</th>
              <th style="width: 260px;">操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <div style="font-weight:600">本地 Fireworks</div>
        <div class="muted">localStorage 键：<span class="mono">fireworks</span></div>
      </div>
      <div style="overflow:auto; max-height: 45vh; border:1px solid #eee; border-radius:8px;">
        <table id="localTable">
          <thead>
            <tr>
              <th style="width: 220px;">ID</th>
              <th>信息</th>
              <th style="width: 200px;">校验</th>
              <th style="width: 260px;">操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="./admin-fireworks.js"></script>
</body>
</html>
