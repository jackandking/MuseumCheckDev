<body>
    <div class="container">
        <header>
            <h1>
                <span id="settingsIcon" class="settings-icon" title="点击打开设置">🏛️</span> 博物馆打卡
            </h1>
            <p class="subtitle">通过博物馆亲子游增进亲子关系</p>

        </header>



        <nav class="age-selector" aria-label="年龄组选择">
            <fieldset class="age-group-fieldset">
                <legend class="age-group-legend">孩子年龄：</legend>
                <div class="age-options">
                    <label class="age-option">
                        <input type="radio" name="ageGroup" value="3-6" checked aria-describedby="age-help">
                        <span class="age-option-text">3-6岁 (学龄前)</span>
                    </label>
                    <label class="age-option">
                        <input type="radio" name="ageGroup" value="7-12" aria-describedby="age-help">
                        <span class="age-option-text">7-12岁 (小学)</span>
                    </label>
                    <label class="age-option">
                        <input type="radio" name="ageGroup" value="13-18" aria-describedby="age-help">
                        <span class="age-option-text">13-18岁 (中学)</span>
                    </label>
                </div>
            </fieldset>
            <span id="age-help" class="sr-only">选择孩子的年龄段以获取适合的博物馆参观内容</span>
        </nav>

        <main role="main">
            <section class="museum-list" id="museums">
                <h2>全国主要博物馆清单</h2>
                <p class="section-description">精选全国<span id="sectionMuseumCount">主要</span>博物馆，通过专业的亲子互动指导，让每次参观都成为增进亲子关系的宝贵机会</p>
                
                <div class="stats" role="status" aria-live="polite">
                    <div class="progress-display">
                        <div class="progress-text">
                            <span id="visitedCount">0</span>/<span id="totalCount">0</span> 已参观
                            (<span id="visitedPercentage">0</span>%)
                        </div>
                        <button id="assessmentHistoryButton" class="assessment-history-button assessment-history-button-inline" title="查看测评历史">📊 <span class="button-text">测评历史</span></button>
                        <button id="clearAllDataButton" class="clear-data-button clear-all-button clear-data-button-icon" title="清空所有数据">🗑️</button>
                    </div>
                    <div class="achievement-stats">
                        <div class="achievement-inline">
                            <div class="achievement-text">
                                🏅 获得成就: <span id="achievementCount">0</span>个
                            </div>
                            <button id="achievementButton" class="achievement-button achievement-button-inline" title="查看成就详情">🎖️ 我的成就</button>

                        </div>
                    </div>
                </div>
                
                <!-- Search functionality -->
                <div class="search-section">
                    <div class="search-container">
                        <input type="text" id="museumSearch" class="search-input" placeholder="🔍 搜索博物馆名称、城市或标签..." aria-label="搜索博物馆">
                        <button id="clearSearch" class="clear-search-button" title="清空搜索" style="display: none;">✕</button>
                    </div>
                    <div class="search-results-info" id="searchResultsInfo" style="display: none;">
                        显示 <span id="filteredCount">0</span> 个搜索结果
                    </div>
                </div>
                <div id="museumGrid" class="museum-grid" role="grid" aria-label="博物馆列表">
                    <!-- Loading indicator -->
                    <div id="loadingIndicator" class="loading-indicator">
                        <div class="loading-spinner"></div>
                        <p>正在载入博物馆数据...</p>
                    </div>
                    <!-- Museums will be populated by JavaScript -->
                </div>
            </section>
        </main>
    </div>

    <div id="museumModal" class="modal hidden">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle"></h2>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- Assessment Modal -->
    <div id="assessmentModal" class="modal hidden">
        <div class="modal-content assessment-content">
            <span class="close">&times;</span>
            <h2 id="assessmentTitle">🧡 亲子关系测评</h2>
            <div id="assessmentContent">
                <div class="assessment-intro">
                    <!-- Simplified introduction - verbose content removed -->
                </div>
                <div class="assessment-form" id="assessmentForm">
                    <!-- Content will be filled dynamically -->
                </div>
                <div class="assessment-buttons">
                    <button id="assessmentPrev" class="btn-secondary" style="display: none;">上一步</button>
                    <button id="assessmentNext" class="btn-primary">开始测评</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Achievement Modal -->
    <div id="achievementModal" class="modal achievement-modal hidden">
        <div class="modal-content achievement-content">
            <span class="close">&times;</span>
            <h2>🎖️ 我的成就</h2>
            <div class="achievement-summary">
                <div class="achievement-overview">
                    <div class="achievement-stat">
                        <span class="stat-number" id="totalAchievements">0</span>
                        <span class="stat-label">总成就</span>
                    </div>
                    <div class="achievement-stat">
                        <span class="stat-number" id="visitProgress">0</span>
                        <span class="stat-label">参观进度</span>
                    </div>
                </div>
                <button id="generateAchievementPoster" class="achievement-poster-button">
                    🎨 生成成就海报
                </button>
            </div>
            <div id="achievementList" class="achievement-list">
                <!-- Achievements will be populated by JavaScript -->
            </div>
            <div id="achievementPosterSection" class="achievement-poster-section" style="display: none;">
                <canvas id="achievementPosterCanvas" style="display: none; max-width: 100%;"></canvas>
                <div id="achievementPosterPreview" class="poster-preview"></div>
                <button id="downloadAchievementPoster" class="poster-button" style="display: none;">📱 下载成就海报</button>
            </div>
        </div>
    </div>

    <!-- Assessment History Modal -->
    <div id="assessmentHistoryModal" class="modal assessment-history-modal hidden">
        <div class="modal-content assessment-history-content">
            <span class="close">&times;</span>
            <h2>📊 亲子测评历史</h2>
            <div class="assessment-history-summary">
                <div class="history-overview">
                    <div class="history-stat">
                        <span class="stat-number" id="totalAssessments">0</span>
                        <span class="stat-label">总测评次数</span>
                    </div>
                    <div class="history-stat">
                        <span class="stat-number" id="averageScore">0</span>
                        <span class="stat-label">平均得分</span>
                    </div>
                    <div class="history-stat">
                        <span class="stat-number" id="latestScore">0</span>
                        <span class="stat-label">最新得分</span>
                    </div>
                </div>
                <div class="history-filters">
                    <select id="historyMuseumFilter" class="filter-select">
                        <option value="">所有博物馆</option>
                    </select>
                    <button id="exportHistoryButton" class="export-button" title="导出测评数据">📤 导出数据</button>
                </div>
            </div>
            <div id="assessmentHistoryContent" class="assessment-history-content">
                <div class="history-empty" id="historyEmptyState">
                    <div class="empty-icon">📊</div>
                    <p>您还没有任何测评记录</p>
                    <p>完成一次亲子测评后，历史记录将显示在这里</p>
                </div>
                <div class="history-list" id="historyList" style="display: none;">
                    <!-- History entries will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal settings-modal hidden">
        <div class="modal-content settings-content">
            <span class="close">&times;</span>
            <h2>⚙️ 设置</h2>
            <div class="settings-section">
                <h3>📊 应用信息</h3>
                <div class="settings-item">
                    <label class="settings-label">博物馆数量：</label>
                    <span class="settings-value" id="museumCountSettings">0</span>
                </div>
            </div>
        </div>
    </div>

    <script src="museums-data.js"></script>
    <script src="script.js"></script>
</body>
