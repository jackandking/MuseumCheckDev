<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/images/favicon.ico" type="image/x-icon" />
    <!-- Baidu Analytics (百度统计) -->
    <script>
        var _hmt = _hmt || [];
        (function() {
            var hm = document.createElement("script");
            hm.src = "https://hm.baidu.com/hm.js?10856afa2ea23687b7e8f5b901795c57";
            var s = document.getElementsByTagName("script")[0]; 
            s.parentNode.insertBefore(hm, s);
        })();
    </script>
    <title>统一统 - 博物馆互动调查</title>
    <script src="../js/debug-mode.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", 
                         "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .survey-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 2em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 1.1em;
            margin-bottom: 30px;
        }

        .survey-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .survey-card {
            display: flex;
            flex-direction: column;
            border: 2px solid #ecf0f1;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            background: white;
            text-decoration: none;
            color: inherit;
        }

        .survey-card:hover {
            border-color: #3498db;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.2);
            transform: translateY(-2px);
        }

        .survey-icon {
            font-size: 2.5em;
            margin-bottom: 15px;
            text-align: center;
        }

        .survey-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 10px;
        }

        .survey-description {
            font-size: 0.9em;
            color: #7f8c8d;
            text-align: center;
            line-height: 1.5;
        }

        .more {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ecf0f1;
        }

        .more a {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .more a:hover {
            color: #2980b9;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .survey-container {
                padding: 20px;
                border-radius: 15px;
            }
            
            h1 {
                font-size: 1.5em;
            }
            
            .subtitle {
                font-size: 1em;
            }
            
            .survey-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="survey-container">
        <h1>🎯 统一统</h1>
        <p class="subtitle">选择一个有趣的博物馆互动调查</p>
        
        <div class="survey-grid">
            <a href="national-treasures/index.html" class="survey-card">
                <div class="survey-icon">🎁</div>
                <div class="survey-title">中国十大国宝</div>
                <div class="survey-description">选择你亲眼见过的国宝文物，看看有多少人和你一样</div>
            </a>
            
            <a href="treasure/index.html" class="survey-card">
                <div class="survey-icon">🏺</div>
                <div class="survey-title">猜猜镇馆之宝</div>
                <div class="survey-description">猜猜哪个是博物馆的镇馆之宝</div>
            </a>
            
            <a href="guess/index.html" class="survey-card">
                <div class="survey-icon">🤔</div>
                <div class="survey-title">看图猜文物</div>
                <div class="survey-description">看图片猜猜这是什么文物</div>
            </a>
            
            <a href="forbidden-city-treasure/index.html" class="survey-card">
                <div class="survey-icon">🏯</div>
                <div class="survey-title">故宫镇馆之宝</div>
                <div class="survey-description">挑战故宫博物院的国宝知识</div>
            </a>
            
            <a href="archaeology-museum-treasure/index.html" class="survey-card">
                <div class="survey-icon">⛏️</div>
                <div class="survey-title">考古博物馆宝藏</div>
                <div class="survey-description">探索考古博物馆的珍贵文物</div>
            </a>
            
            <a href="popularity/index.html" class="survey-card">
                <div class="survey-icon">🔥</div>
                <div class="survey-title">人气投票</div>
                <div class="survey-description">给你最喜欢的文物投票</div>
            </a>
        </div>
        
        <div class="more">
            <a href="../index.html">← 返回博物馆打卡首页</a>
        </div>
    </div>
</body>
</html>
