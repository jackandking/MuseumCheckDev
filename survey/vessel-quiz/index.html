<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古代容器猜猜看 - 博物馆打卡</title>
    <script>
        var _hmt = _hmt || [];
        (function() {
            var hm = document.createElement("script");
            hm.src = "https://hm.baidu.com/hm.js?10856afa2ea23687b7e8f5b901795c57";
            var s = document.getElementsByTagName("script")[0];
            s.parentNode.insertBefore(hm, s);
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="survey-container">
        <div class="header">
            <h1 id="pageTitle">古代容器猜猜看</h1>
            <p class="subtitle">看图识器，你能连对几个？</p>
        </div>

        <div id="progressBar" class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
            <span class="progress-text" id="progressText">0/0</span>
        </div>

        <div id="quizArea">
            <div class="treasure-card" id="treasureCard">
                <img id="treasureImage" src="" alt="文物图片" class="treasure-image">
                <div class="treasure-name" id="treasureName"></div>
                <div class="treasure-museum" id="treasureMuseum"></div>
            </div>

            <p class="question-text">这是什么类型的容器？</p>

            <div class="options-grid" id="optionsContainer"></div>

            <div class="feedback-overlay" id="feedbackOverlay" style="display:none">
                <div class="feedback-content" id="feedbackContent"></div>
            </div>
        </div>

        <div id="result" class="result" style="display:none">
            <div class="result-header" id="resultHeader"></div>
            <div class="result-score" id="resultScore"></div>
            <div class="result-comparison" id="resultComparison"></div>
            <div class="result-actions">
                <button class="btn btn-primary" onclick="restartQuiz()">再来一次</button>
                <button class="btn btn-secondary" onclick="jumpToIndex()">返回调查中心</button>
            </div>
        </div>
    </div>

    <script src="../util.js"></script>
    <script src="app.js"></script>
    <script src="../../js/event-wall-service.js"></script>
    <script src="../../js/event-tracking-init.js"></script>
</body>
</html>
