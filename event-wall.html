    <script>
        // Configuration
        const CONFIG = {
            KV_STORE_ENDPOINT: 'https://rlyhccdr2g.execute-api.us-west-2.amazonaws.com/default/keyValueStore',
            EVENT_KEY: 'museumcheck-events',
            EVENT_TYPE_ICONS: {
                'visit': '🏛️',
                'search': '🔍',
                'page_view': '📄',
                'task': '📝',
                'checklist': '✅',
                'achievement': '🏆',
                'assessment': '📊',
                'feedback': '💬',
                'wish': '🌟',
                'other': '📌'
            },
            EVENT_TYPE_LABELS: {
                'visit': '博物馆参观',
                'search': '搜索活动',
                'page_view': '页面访问',
                'task': '任务完成',
                'checklist': '清单完成',
                'achievement': '成就解锁',
                'assessment': '亲子测评',
                'feedback': '用户反馈',
                'wish': '心愿单',
                'other': '其他活动'
            }
        };

        // State
        let allEvents = [];
        let currentFilter = 'all';

        // Fetch events from KV store
        async function fetchEvents() {
            try {
                const url = `${CONFIG.KV_STORE_ENDPOINT}?key=${encodeURIComponent(CONFIG.EVENT_KEY)}&sortKey=*`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    console.error('Failed to fetch events:', response.status);
                    return [];
                }
                
                const data = await response.json();
                
                if (!data.value) {
                    return [];
                }
                
                const parsed = JSON.parse(data.value);
                let events = [];
                
                if (Array.isArray(parsed)) {
                    events = parsed.map(item => {
                        try {
                            return typeof item.value === 'string' ? JSON.parse(item.value) : item.value;
                        } catch (e) {
                            console.error('Error parsing event:', e);
                            return null;
                        }
                    }).filter(item => item !== null);
                } else {
                    const eventData = typeof parsed === 'string' ? JSON.parse(parsed) : parsed;
                    events = [eventData];
                }
                
                // Sort by timestamp (newest first)
                events.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                
                console.log(`Loaded ${events.length} events from KV store`);
                return events;
                
            } catch (error) {
                console.error('Error fetching events:', error);
                return [];
            }
        }

        // Format timestamp
        function formatTimestamp(timestamp) {
            if (!timestamp) return '未知时间';
            
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            
            // Less than 1 minute
            if (diff < 60000) {
                return '刚刚';
            }
            
            // Less than 1 hour
            if (diff < 3600000) {
                const minutes = Math.floor(diff / 60000);
                return `${minutes}分钟前`;
            }
            
            // Less than 24 hours
            if (diff < 86400000) {
                const hours = Math.floor(diff / 3600000);
                return `${hours}小时前`;
            }
            
            // Format as date
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const hour = date.getHours().toString().padStart(2, '0');
            const minute = date.getMinutes().toString().padStart(2, '0');
            
            return `${month}月${day}日 ${hour}:${minute}`;
        }

        // Get event type from event data
        function getEventType(event) {
            if (event.eventType) return event.eventType;
            if (event.type) return event.type;
            
            // Infer from event name or data
            if (event.eventName) {
                if (event.eventName.includes('visit') || event.eventName.includes('museum')) return 'visit';
                if (event.eventName.includes('checklist')) return 'checklist';
                if (event.eventName.includes('achievement')) return 'achievement';
                if (event.eventName.includes('assessment')) return 'assessment';
            }
            
            return 'other';
        }

        // Create event card HTML
        function createEventCard(event) {
            const eventType = getEventType(event);
            const icon = CONFIG.EVENT_TYPE_ICONS[eventType] || CONFIG.EVENT_TYPE_ICONS.other;
            const typeLabel = CONFIG.EVENT_TYPE_LABELS[eventType] || CONFIG.EVENT_TYPE_LABELS.other;
            const timestamp = formatTimestamp(event.timestamp);
            
            // Build event title and description
            let title = event.title || event.eventName || '用户活动';
            let description = event.description || '';
            
            // Generate description from event data if not provided
            if (!description && event.parameters) {
                const params = event.parameters;
                if (params.museumName) {
                    description = `博物馆：${params.museumName}`;
                } else if (params.museum_id) {
                    description = `博物馆ID：${params.museum_id}`;
                }
            }
            
            // Build metadata
            const metadata = [];
            // Display child nickname if available, otherwise show userId
            if (event.childNickname) {
                metadata.push(`<div class="event-meta-item">👤 ${event.childNickname}</div>`);
            } else if (event.userId) {
                metadata.push(`<div class="event-meta-item">👤 用户 ${event.userId.substring(0, 8)}</div>`);
            }
            if (event.parameters && event.parameters.museumName) {
                metadata.push(`<div class="event-meta-item">🏛️ ${event.parameters.museumName}</div>`);
            }
            
            return `
                <div class="event-card" data-type="${eventType}">
                    <div class="event-header">
                        <span class="event-type ${eventType}">
                            ${icon} ${typeLabel}
                        </span>
                        <span class="event-time">${timestamp}</span>
                    </div>
                    <div class="event-content">
                        <div class="event-title">${title}</div>
                        ${description ? `<div class="event-description">${description}</div>` : ''}
                    </div>
                    ${metadata.length > 0 ? `<div class="event-meta">${metadata.join('')}</div>` : ''}
                </div>
            `;
        }

        // Render events
        function renderEvents() {
            const loadingState = document.getElementById('loadingState');
            const emptyState = document.getElementById('emptyState');
            const eventsGrid = document.getElementById('eventsGrid');
            
            loadingState.style.display = 'none';
            
            // Filter events
            const filteredEvents = currentFilter === 'all' 
                ? allEvents 
                : allEvents.filter(event => getEventType(event) === currentFilter);
            
            if (filteredEvents.length === 0) {
                emptyState.style.display = 'block';
                eventsGrid.style.display = 'none';
                return;
            }
            
            emptyState.style.display = 'none';
            eventsGrid.style.display = 'grid';
            
            // Render event cards
            eventsGrid.innerHTML = filteredEvents.map(event => createEventCard(event)).join('');
        }

        // Update statistics
        function updateStats() {
            const totalEvents = allEvents.length;
            document.getElementById('totalEvents').textContent = totalEvents;

            // Count today's events
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayTimestamp = today.getTime();
            const todayEvents = allEvents.filter(event => event.timestamp >= todayTimestamp).length;
            document.getElementById('todayEvents').textContent = todayEvents;

            // Count unique users
            const uniqueUsers = new Set(allEvents.map(event => event.userId).filter(Boolean)).size;
            document.getElementById('uniqueUsers').textContent = uniqueUsers;

            // Today's PV
            const todayPV = allEvents.filter(e => e.timestamp >= todayTimestamp && getEventType(e) === 'page_view').length;
            document.getElementById('todayPV').textContent = todayPV;

            // Total tasks completed
            const totalTasks = allEvents.filter(e => getEventType(e) === 'task').length;
            document.getElementById('totalTasks').textContent = totalTasks;

            // Build analytics dashboard
            buildAnalytics();
        }

        function buildAnalytics() {
            const panel = document.getElementById('analyticsPanel');
            if (allEvents.length === 0) { panel.style.display = 'none'; return; }
            panel.style.display = '';

            // Top museums (by visit count)
            const museumCounts = {};
            allEvents.filter(e => getEventType(e) === 'visit').forEach(e => {
                const name = (e.parameters && e.parameters.museumName) || '';
                if (name) museumCounts[name] = (museumCounts[name] || 0) + 1;
            });
            const topMuseums = Object.entries(museumCounts).sort((a,b) => b[1]-a[1]).slice(0, 5);
            document.getElementById('topMuseums').innerHTML = topMuseums.length
                ? topMuseums.map(([name, count]) =>
                    `<div class="analytics-rank-item"><span class="analytics-rank-name">${name}</span><span class="analytics-rank-count">${count}</span></div>`
                ).join('')
                : '<div style="color:#999;font-size:13px">暂无数据</div>';

            // Top searches
            const searchCounts = {};
            allEvents.filter(e => getEventType(e) === 'search').forEach(e => {
                const q = (e.parameters && e.parameters.query) || '';
                if (q && q.length >= 2) searchCounts[q] = (searchCounts[q] || 0) + 1;
            });
            const topSearches = Object.entries(searchCounts).sort((a,b) => b[1]-a[1]).slice(0, 5);
            document.getElementById('topSearches').innerHTML = topSearches.length
                ? topSearches.map(([q, count]) =>
                    `<div class="analytics-rank-item"><span class="analytics-rank-name">"${q}"</span><span class="analytics-rank-count">${count}</span></div>`
                ).join('')
                : '<div style="color:#999;font-size:13px">暂无数据</div>';

            // Daily activity chart (last 7 days)
            const dayCounts = {};
            const now = new Date();
            for (let i = 6; i >= 0; i--) {
                const d = new Date(now);
                d.setDate(d.getDate() - i);
                dayCounts[`${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`] = 0;
            }
            allEvents.forEach(e => {
                if (!e.timestamp) return;
                const d = new Date(e.timestamp);
                const key = `${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`;
                if (key in dayCounts) dayCounts[key]++;
            });
            const maxDay = Math.max(...Object.values(dayCounts), 1);
            document.getElementById('dailyChart').innerHTML = Object.entries(dayCounts).map(([day, count]) =>
                `<div class="analytics-bar">
                    <span class="analytics-bar-label">${day}</span>
                    <div class="analytics-bar-track"><div class="analytics-bar-fill" style="width:${(count/maxDay*100).toFixed(0)}%"></div></div>
                    <span class="analytics-bar-count">${count}</span>
                </div>`
            ).join('');

            // Top pages
            const pageCounts = {};
            allEvents.filter(e => getEventType(e) === 'page_view').forEach(e => {
                const page = (e.parameters && e.parameters.pageName) || e.description || '';
                const name = page.replace('访问 ', '');
                if (name) pageCounts[name] = (pageCounts[name] || 0) + 1;
            });
            const topPages = Object.entries(pageCounts).sort((a,b) => b[1]-a[1]).slice(0, 5);
            document.getElementById('topPages').innerHTML = topPages.length
                ? topPages.map(([name, count]) =>
                    `<div class="analytics-rank-item"><span class="analytics-rank-name">${name}</span><span class="analytics-rank-count">${count}</span></div>`
                ).join('')
                : '<div style="color:#999;font-size:13px">暂无数据</div>';
        }

        // Load and display events
        async function loadEvents() {
            allEvents = await fetchEvents();
            updateStats();
            renderEvents();
        }

        // Setup filter buttons
        function setupFilters() {
            const filterButtons = document.querySelectorAll('.filter-btn');
            
            filterButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Update active state
                    filterButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    // Update filter and re-render
                    currentFilter = btn.dataset.filter;
                    renderEvents();
                });
            });
        }

        // Setup refresh button
        function setupRefresh() {
            const refreshBtn = document.getElementById('refreshBtn');
            
            refreshBtn.addEventListener('click', async () => {
                refreshBtn.disabled = true;
                refreshBtn.textContent = '⏳ 刷新中...';
                
                await loadEvents();
                
                refreshBtn.disabled = false;
                refreshBtn.textContent = '🔄 刷新';
            });
        }

        // Initialize
        async function init() {
            console.log('Initializing Event Wall...');

            setupFilters();
            setupRefresh();
            setupFeedbackForm();

            await loadEvents();
        }

        // Setup feedback form
        function setupFeedbackForm() {
            const fab = document.getElementById('feedbackFab');
            const overlay = document.getElementById('feedbackOverlay');
            const cancelBtn = document.getElementById('feedbackCancel');
            const submitBtn = document.getElementById('feedbackSubmit');
            const textarea = document.getElementById('feedbackText');
            const charCount = document.getElementById('feedbackCharCount');
            const form = document.getElementById('feedbackForm');
            const success = document.getElementById('feedbackSuccess');
            const typeBtns = document.querySelectorAll('.feedback-type-btn');

            let selectedType = null;

            fab.addEventListener('click', () => {
                overlay.classList.add('show');
                form.style.display = '';
                success.style.display = 'none';
                textarea.value = '';
                charCount.textContent = '0';
                selectedType = null;
                typeBtns.forEach(b => b.classList.remove('selected'));
                submitBtn.disabled = true;
            });

            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) overlay.classList.remove('show');
            });

            cancelBtn.addEventListener('click', () => {
                overlay.classList.remove('show');
            });

            typeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    typeBtns.forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedType = btn.dataset.type;
                    updateSubmitState();
                });
            });

            textarea.addEventListener('input', () => {
                charCount.textContent = textarea.value.length;
                updateSubmitState();
            });

            function updateSubmitState() {
                const len = textarea.value.trim().length;
                submitBtn.disabled = !selectedType || len < 10;
            }

            submitBtn.addEventListener('click', async () => {
                if (!selectedType || textarea.value.trim().length < 10) return;
                submitBtn.disabled = true;
                submitBtn.textContent = '提交中...';

                try {
                    if (window.eventWallService) {
                        window.eventWallService.trackFeedback(selectedType, textarea.value.trim());
                        await window.eventWallService.flush();
                    }
                    form.style.display = 'none';
                    success.style.display = '';
                    setTimeout(() => {
                        overlay.classList.remove('show');
                        loadEvents(); // Refresh to show the new feedback
                    }, 2000);
                } catch (e) {
                    console.error('Feedback submit failed:', e);
                    submitBtn.disabled = false;
                    submitBtn.textContent = '提交反馈';
                }
            });
        }

        // Start when page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
