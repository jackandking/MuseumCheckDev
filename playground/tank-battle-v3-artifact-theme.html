<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>坦克大战 v3 - 文物图片背景</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
            background: #000;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .game-screen {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        .artifact-background {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-size: cover;
            background-position: center;
            filter: blur(5px) brightness(0.4);
            z-index: 0;
        }

        .game-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .info-bar {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .artifact-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .artifact-thumb {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .artifact-details {
            color: white;
        }

        .artifact-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .artifact-desc {
            font-size: 12px;
            opacity: 0.7;
        }

        .game-status {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .canvas-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        #mainCanvas {
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8),
                        inset 0 0 20px rgba(255, 255, 255, 0.1);
            max-width: 100%;
            max-height: 100%;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .touch-controls {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 30px;
        }

        .move-pad {
            display: grid;
            grid-template-columns: repeat(3, 55px);
            grid-template-rows: repeat(3, 55px);
            gap: 5px;
        }

        .pad-btn {
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 26px;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .pad-btn:active {
            background: rgba(76, 175, 80, 0.5);
            transform: scale(0.9);
        }

        .pad-btn-up { grid-column: 2; grid-row: 1; }
        .pad-btn-left { grid-column: 1; grid-row: 2; }
        .pad-btn-right { grid-column: 3; grid-row: 2; }
        .pad-btn-down { grid-column: 2; grid-row: 3; }

        .pad-center {
            grid-column: 2;
            grid-row: 2;
            background: rgba(100, 100, 100, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            font-size: 20px;
        }

        .center-info {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
        }

        .mission-text {
            font-size: 13px;
            margin-bottom: 5px;
        }

        .mission-target {
            font-size: 18px;
            font-weight: bold;
            color: #FFD700;
        }

        .shoot-area {
            display: flex;
            justify-content: center;
        }

        .shoot-btn {
            width: 110px;
            height: 110px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #c92a2a);
            color: white;
            font-size: 44px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.6);
            transition: all 0.1s;
            position: relative;
        }

        .shoot-btn:active {
            transform: scale(0.92);
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.8);
        }

        .shoot-label {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            font-weight: bold;
        }

        /* Question Modal */
        .question-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(30, 30, 60, 0.98), rgba(60, 30, 90, 0.98));
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(20px);
        }

        .question-panel {
            background: white;
            border-radius: 30px;
            max-width: 90%;
            width: 500px;
            padding: 35px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }

        .question-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .question-artifact {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
            border-radius: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .question-title {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .question-hint {
            font-size: 14px;
            color: #888;
        }

        .question-content {
            background: linear-gradient(135deg, #f5f7fa, #e4e7eb);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .question-text {
            font-size: 17px;
            color: #333;
            font-weight: 500;
            line-height: 1.6;
        }

        .answer-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .answer-item {
            padding: 18px 22px;
            border: 3px solid #e0e0e0;
            border-radius: 16px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .answer-item:active {
            transform: scale(0.97);
        }

        .answer-letter {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #666;
        }

        .answer-item.selected {
            border-color: #667eea;
            background: #f0f0ff;
        }

        .answer-item.selected .answer-letter {
            background: #667eea;
            color: white;
        }

        .answer-item.correct {
            border-color: #4CAF50;
            background: #e8f5e9;
        }

        .answer-item.correct .answer-letter {
            background: #4CAF50;
            color: white;
        }

        .answer-item.incorrect {
            border-color: #f44336;
            background: #ffebee;
        }

        .answer-item.incorrect .answer-letter {
            background: #f44336;
            color: white;
        }

        .feedback-box {
            padding: 20px;
            border-radius: 16px;
            margin-top: 20px;
            font-size: 15px;
            line-height: 1.7;
            display: none;
        }

        .feedback-box.show {
            display: block;
        }

        .feedback-box.success {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            color: #2e7d32;
        }

        .feedback-box.error {
            background: linear-gradient(135deg, #ffebee, #ffcdd2);
            color: #c62828;
        }

        .feedback-reward {
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 2px solid currentColor;
        }

        .start-game-btn {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
            margin-top: 20px;
        }

        .start-game-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Finish Modal */
        .finish-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .finish-modal.visible {
            display: flex;
        }

        .finish-panel {
            background: white;
            border-radius: 30px;
            padding: 45px;
            text-align: center;
            max-width: 90%;
        }

        .finish-icon {
            font-size: 90px;
            margin-bottom: 20px;
        }

        .finish-heading {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-box {
            padding: 15px;
            border-radius: 12px;
            background: #f5f7fa;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
            display: block;
            margin-bottom: 5px;
        }

        .stat-name {
            font-size: 13px;
            color: #888;
        }

        .finish-btn {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="game-screen">
        <div class="artifact-background" id="bgImage"></div>
        
        <div class="game-content">
            <!-- Info Bar -->
            <div class="info-bar">
                <div class="artifact-info">
                    <div class="artifact-thumb" id="artThumb">🏺</div>
                    <div class="artifact-details">
                        <div class="artifact-name" id="artName">后母戊鼎</div>
                        <div class="artifact-desc" id="artDesc">商朝 · 青铜器</div>
                    </div>
                </div>
                <div class="game-status">
                    <div class="status-row">
                        <span>💰 <span id="pointsNum">0</span></span>
                        <span id="heartIcons">❤️❤️❤️</span>
                    </div>
                    <div class="status-row">
                        <span>🎯 剩余：<span id="enemyNum">4</span></span>
                    </div>
                </div>
            </div>

            <!-- Canvas -->
            <div class="canvas-wrapper">
                <canvas id="mainCanvas" width="400" height="400"></canvas>
            </div>

            <!-- Touch Controls -->
            <div class="touch-controls">
                <div class="move-pad">
                    <button class="pad-btn pad-btn-up" data-direction="up">⬆️</button>
                    <button class="pad-btn pad-btn-left" data-direction="left">⬅️</button>
                    <div class="pad-center">🎯</div>
                    <button class="pad-btn pad-btn-right" data-direction="right">➡️</button>
                    <button class="pad-btn pad-btn-down" data-direction="down">⬇️</button>
                </div>

                <div class="center-info">
                    <div class="mission-text">守护文物</div>
                    <div class="mission-target">击败所有入侵者</div>
                </div>

                <div class="shoot-area">
                    <button class="shoot-btn" id="shootButton">
                        🔥
                        <span class="shoot-label">发射</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Question Screen -->
    <div class="question-screen" id="questionScreen">
        <div class="question-panel">
            <div class="question-header">
                <div class="question-artifact" id="qArtifact">🏺</div>
                <div class="question-title" id="qTitle">文物知识问答</div>
                <div class="question-hint">答对可获得额外生命值</div>
            </div>

            <div class="question-content">
                <div class="question-text" id="qText">题目加载中...</div>
            </div>

            <div class="answer-grid" id="answerGrid"></div>

            <div class="feedback-box" id="feedbackBox"></div>

            <button class="start-game-btn" id="confirmBtn" disabled>选择一个答案</button>
        </div>
    </div>

    <!-- Finish Modal -->
    <div class="finish-modal" id="finishModal">
        <div class="finish-panel">
            <div class="finish-icon" id="finishIcon">🎉</div>
            <div class="finish-heading" id="finishTitle">守护成功！</div>
            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-value" id="statScore">0</span>
                    <span class="stat-name">得分</span>
                </div>
                <div class="stat-box">
                    <span class="stat-value" id="statKills">0</span>
                    <span class="stat-name">击杀</span>
                </div>
                <div class="stat-box">
                    <span class="stat-value" id="statLives">3</span>
                    <span class="stat-name">剩余生命</span>
                </div>
            </div>
            <button class="finish-btn" onclick="location.reload()">继续游览 ➡️</button>
        </div>
    </div>

    <script>
        // Data
        const DATA = {
            artifact: {
                name: '后母戊鼎',
                icon: '🏺',
                desc: '商朝 · 青铜器',
                bgImage: 'https://images.unsplash.com/photo-1563510804797-bcf5e47fa37b?w=800',
                quiz: {
                    text: '后母戊鼎重达832公斤，是用什么材料铸造的？',
                    answers: [
                        { letter: 'A', text: '铁', correct: false },
                        { letter: 'B', text: '青铜', correct: true },
                        { letter: 'C', text: '黄金', correct: false },
                        { letter: 'D', text: '白银', correct: false }
                    ],
                    explanation: '后母戊鼎是商朝晚期的青铜礼器，用青铜铸造。青铜是铜和锡的合金，商朝的青铜冶炼技术已经非常发达。',
                    correctReward: '✅ 回答正确！获得额外 +2 生命值 ❤️❤️'
                }
            }
        };

        // Game state
        const state = {
            canvas: null,
            ctx: null,
            player: { x: 200, y: 350, size: 28, dir: 'up', speed: 3.5 },
            enemies: [],
            bullets: [],
            enemyBullets: [],
            score: 0,
            lives: 3,
            kills: 0,
            active: false,
            controls: { up: false, down: false, left: false, right: false }
        };

        // Initialize
        window.onload = () => {
            setupQuestion();
        };

        function setupQuestion() {
            // Set artifact info
            document.getElementById('bgImage').style.backgroundImage = `url(${DATA.artifact.bgImage})`;
            document.getElementById('artThumb').textContent = DATA.artifact.icon;
            document.getElementById('artName').textContent = DATA.artifact.name;
            document.getElementById('artDesc').textContent = DATA.artifact.desc;
            document.getElementById('qArtifact').textContent = DATA.artifact.icon;
            document.getElementById('qTitle').textContent = DATA.artifact.name;
            document.getElementById('qText').textContent = DATA.artifact.quiz.text;

            // Create answers
            const grid = document.getElementById('answerGrid');
            grid.innerHTML = '';
            DATA.artifact.quiz.answers.forEach((ans, idx) => {
                const div = document.createElement('div');
                div.className = 'answer-item';
                div.innerHTML = `
                    <div class="answer-letter">${ans.letter}</div>
                    <div>${ans.text}</div>
                `;
                div.onclick = () => selectAnswer(idx, div);
                grid.appendChild(div);
            });

            document.getElementById('confirmBtn').onclick = checkAnswer;
        }

        function selectAnswer(idx, elem) {
            document.querySelectorAll('.answer-item').forEach(a => a.classList.remove('selected'));
            elem.classList.add('selected');
            elem.dataset.index = idx;
            document.getElementById('confirmBtn').disabled = false;
            document.getElementById('confirmBtn').textContent = '确认答案';
        }

        function checkAnswer() {
            const selected = document.querySelector('.answer-item.selected');
            if (!selected) return;

            const idx = parseInt(selected.dataset.index);
            const isCorrect = DATA.artifact.quiz.answers[idx].correct;

            document.querySelectorAll('.answer-item').forEach((elem, i) => {
                if (DATA.artifact.quiz.answers[i].correct) {
                    elem.classList.add('correct');
                } else if (i === idx) {
                    elem.classList.add('incorrect');
                }
                elem.style.pointerEvents = 'none';
            });

            const feedback = document.getElementById('feedbackBox');
            feedback.classList.add('show');

            if (isCorrect) {
                state.lives += 2;
                feedback.className = 'feedback-box show success';
                feedback.innerHTML = `
                    ${DATA.artifact.quiz.explanation}
                    <div class="feedback-reward">${DATA.artifact.quiz.correctReward}</div>
                `;
            } else {
                feedback.className = 'feedback-box show error';
                feedback.innerHTML = `❌ 答错了<br>${DATA.artifact.quiz.explanation}`;
            }

            document.getElementById('confirmBtn').textContent = '开始守护 🚀';
            document.getElementById('confirmBtn').disabled = false;
            document.getElementById('confirmBtn').onclick = startGame;
        }

        function startGame() {
            document.getElementById('questionScreen').style.display = 'none';

            state.canvas = document.getElementById('mainCanvas');
            state.ctx = state.canvas.getContext('2d');

            // Responsive sizing
            const wrapper = state.canvas.parentElement;
            const size = Math.min(wrapper.clientWidth - 20, wrapper.clientHeight - 20, 600);
            state.canvas.width = size;
            state.canvas.height = size;

            // Create enemies
            for (let i = 0; i < 4; i++) {
                state.enemies.push({
                    x: 60 + i * 100,
                    y: 60,
                    size: 28,
                    vx: 1.5,
                    vy: 0.8,
                    lastShot: 0
                });
            }

            attachControls();
            updateDisplay();
            state.active = true;
            mainLoop();
        }

        function attachControls() {
            // Directional pad
            document.querySelectorAll('.pad-btn').forEach(btn => {
                const dir = btn.dataset.direction;
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    state.controls[dir] = true;
                });
                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    state.controls[dir] = false;
                });
            });

            // Shoot button
            document.getElementById('shootButton').addEventListener('touchstart', (e) => {
                e.preventDefault();
                shoot();
            });

            // Keyboard
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp') { state.controls.up = true; state.player.dir = 'up'; }
                if (e.key === 'ArrowDown') { state.controls.down = true; state.player.dir = 'down'; }
                if (e.key === 'ArrowLeft') { state.controls.left = true; state.player.dir = 'left'; }
                if (e.key === 'ArrowRight') { state.controls.right = true; state.player.dir = 'right'; }
                if (e.key === ' ') shoot();
                e.preventDefault();
            });

            document.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowUp') state.controls.up = false;
                if (e.key === 'ArrowDown') state.controls.down = false;
                if (e.key === 'ArrowLeft') state.controls.left = false;
                if (e.key === 'ArrowRight') state.controls.right = false;
            });
        }

        function mainLoop() {
            if (!state.active) return;

            processUpdate();
            renderFrame();
            requestAnimationFrame(mainLoop);
        }

        function processUpdate() {
            // Player movement
            if (state.controls.up) {
                state.player.y -= state.player.speed;
                state.player.dir = 'up';
            }
            if (state.controls.down) {
                state.player.y += state.player.speed;
                state.player.dir = 'down';
            }
            if (state.controls.left) {
                state.player.x -= state.player.speed;
                state.player.dir = 'left';
            }
            if (state.controls.right) {
                state.player.x += state.player.speed;
                state.player.dir = 'right';
            }

            // Boundaries
            const s = state.player.size;
            state.player.x = Math.max(s/2, Math.min(state.canvas.width - s/2, state.player.x));
            state.player.y = Math.max(s/2, Math.min(state.canvas.height - s/2, state.player.y));

            // Bullets
            state.bullets = state.bullets.filter(b => {
                b.y -= 8;
                return b.y > -10;
            });

            // Enemies
            state.enemies.forEach(e => {
                e.x += e.vx;
                e.y += e.vy;
                if (e.x < e.size || e.x > state.canvas.width - e.size) e.vx *= -1;
                if (e.y < e.size || e.y > state.canvas.height * 0.6) e.vy *= -1;

                // Enemy shoots
                if (Date.now() - e.lastShot > 3000 && Math.random() < 0.025) {
                    state.enemyBullets.push({ x: e.x, y: e.y + e.size/2, speed: 4.5 });
                    e.lastShot = Date.now();
                }
            });

            state.enemyBullets = state.enemyBullets.filter(b => {
                b.y += b.speed;
                return b.y < state.canvas.height + 10;
            });

            // Hit detection
            state.bullets.forEach((b, bi) => {
                state.enemies.forEach((e, ei) => {
                    if (Math.abs(b.x - e.x) < e.size && Math.abs(b.y - e.y) < e.size) {
                        state.bullets.splice(bi, 1);
                        state.enemies.splice(ei, 1);
                        state.score += 200;
                        state.kills++;
                        updateDisplay();
                    }
                });
            });

            state.enemyBullets.forEach((b, bi) => {
                if (Math.abs(b.x - state.player.x) < state.player.size/2 && 
                    Math.abs(b.y - state.player.y) < state.player.size/2) {
                    state.enemyBullets.splice(bi, 1);
                    state.lives--;
                    updateDisplay();
                    if (state.lives <= 0) gameFinish(false);
                }
            });

            // Victory check
            if (state.enemies.length === 0) gameFinish(true);
        }

        function renderFrame() {
            const ctx = state.ctx;
            const w = state.canvas.width;
            const h = state.canvas.height;

            // Background
            ctx.fillStyle = 'rgba(20, 20, 40, 0.85)';
            ctx.fillRect(0, 0, w, h);

            // Grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 1;
            for (let x = 0; x < w; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
                ctx.stroke();
            }

            // Player tank
            const p = state.player;
            ctx.fillStyle = '#4ecca3';
            ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);

            // Barrel
            ctx.fillStyle = '#3ba886';
            if (p.dir === 'up') ctx.fillRect(p.x - 4, p.y - p.size/2 - 10, 8, 12);
            else if (p.dir === 'down') ctx.fillRect(p.x - 4, p.y + p.size/2 - 2, 8, 12);
            else if (p.dir === 'left') ctx.fillRect(p.x - p.size/2 - 10, p.y - 4, 12, 8);
            else if (p.dir === 'right') ctx.fillRect(p.x + p.size/2 - 2, p.y - 4, 12, 8);

            // Enemy tanks
            ctx.fillStyle = '#ff6b6b';
            state.enemies.forEach(e => {
                ctx.fillRect(e.x - e.size/2, e.y - e.size/2, e.size, e.size);
            });

            // Bullets
            ctx.fillStyle = '#ffd93d';
            state.bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
                ctx.fill();
            });

            state.enemyBullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function shoot() {
            if (!state.active) return;
            state.bullets.push({ x: state.player.x, y: state.player.y - 20 });
        }

        function updateDisplay() {
            document.getElementById('pointsNum').textContent = state.score;
            document.getElementById('heartIcons').textContent = '❤️'.repeat(Math.max(0, state.lives));
            document.getElementById('enemyNum').textContent = state.enemies.length;
        }

        function gameFinish(won) {
            state.active = false;
            document.getElementById('finishIcon').textContent = won ? '🎉' : '💔';
            document.getElementById('finishTitle').textContent = won ? '守护成功！' : '守护失败';
            document.getElementById('statScore').textContent = state.score;
            document.getElementById('statKills').textContent = state.kills;
            document.getElementById('statLives').textContent = state.lives;
            document.getElementById('finishModal').classList.add('visible');
        }
    </script>
</body>
</html>
