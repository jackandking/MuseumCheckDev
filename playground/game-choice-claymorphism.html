<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方案1: Claymorphism 风格 - 游戏选择界面</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4000;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: linear-gradient(135deg, #FDBCB4 0%, #ADD8E6 100%);
            border-radius: 24px;
            padding: 32px 24px;
            max-width: 520px;
            width: 100%;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.2),
                inset 0 2px 8px rgba(255, 255, 255, 0.5);
            animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .title {
            font-family: 'Fredoka', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #2D3748;
            text-align: center;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.5);
        }

        .subtitle {
            font-size: 16px;
            color: #4A5568;
            text-align: center;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 20px 12px;
            text-align: center;
            cursor: pointer;
            border: 3px solid #2D3748;
            box-shadow: 
                4px 4px 0 #2D3748,
                inset 0 2px 4px rgba(255, 255, 255, 0.8);
            transition: all 0.2s ease-out;
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 
                6px 6px 0 #2D3748,
                inset 0 2px 4px rgba(255, 255, 255, 0.8);
        }

        .game-card:active {
            transform: translateY(2px);
            box-shadow: 
                2px 2px 0 #2D3748,
                inset 0 2px 4px rgba(255, 255, 255, 0.8);
        }

        .game-icon {
            font-size: 48px;
            margin-bottom: 8px;
            display: block;
            filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.1));
        }

        .game-name {
            font-family: 'Fredoka', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #2D3748;
            margin-bottom: 4px;
        }

        .game-desc {
            font-size: 12px;
            color: #718096;
            font-weight: 500;
        }

        .skip-btn {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.8);
            border: 3px solid #2D3748;
            border-radius: 16px;
            font-family: 'Fredoka', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #2D3748;
            cursor: pointer;
            box-shadow: 
                4px 4px 0 #2D3748,
                inset 0 2px 4px rgba(255, 255, 255, 0.8);
            transition: all 0.2s ease-out;
        }

        .skip-btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                5px 5px 0 #2D3748,
                inset 0 2px 4px rgba(255, 255, 255, 0.8);
        }

        .skip-btn:active {
            transform: translateY(2px);
            box-shadow: 
                2px 2px 0 #2D3748,
                inset 0 2px 4px rgba(255, 255, 255, 0.8);
        }

        @media (max-width: 480px) {
            .modal {
                padding: 24px 16px;
            }

            .title {
                font-size: 24px;
            }

            .games-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }

            .game-card {
                padding: 16px 8px;
            }

            .game-icon {
                font-size: 36px;
            }

            .game-name {
                font-size: 14px;
            }

            .game-desc {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="modal">
            <div class="title">🎁 任务完成奖励</div>
            <div class="subtitle">随机推荐3个游戏，选择你最想玩的</div>
            
            <div class="games-grid">
                <div class="game-card">
                    <span class="game-icon">🧭</span>
                    <div class="game-name">迷宫挑战</div>
                    <div class="game-desc">动脑找出口</div>
                </div>
                
                <div class="game-card">
                    <span class="game-icon">🐍</span>
                    <div class="game-name">贪食蛇</div>
                    <div class="game-desc">越吃越长</div>
                </div>
                
                <div class="game-card">
                    <span class="game-icon">🐝</span>
                    <div class="game-name">小蜜蜂</div>
                    <div class="game-desc">躲避反击</div>
                </div>
            </div>
            
            <button class="skip-btn">稍后再玩</button>
        </div>
    </div>
</body>
</html>
