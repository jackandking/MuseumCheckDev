<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方案2: Neubrutalism 风格 - 游戏选择界面</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: #FFDE59;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4000;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: #FFFFFF;
            border: 4px solid #000000;
            box-shadow: 8px 8px 0 #000000;
            padding: 32px 24px;
            max-width: 520px;
            width: 100%;
            animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {
            font-family: 'Fredoka', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #000000;
            text-align: center;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 16px;
            color: #000000;
            text-align: center;
            margin-bottom: 24px;
            font-weight: 600;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .game-card {
            background: #FFFFFF;
            border: 4px solid #000000;
            box-shadow: 4px 4px 0 #000000;
            padding: 20px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease-out;
            position: relative;
        }

        .game-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #000000;
        }

        .game-card:active {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 #000000;
        }

        .game-card:nth-child(1) {
            background: #FF5757;
        }

        .game-card:nth-child(2) {
            background: #FFDE59;
        }

        .game-card:nth-child(3) {
            background: #4ECDC4;
        }

        .game-icon {
            font-size: 48px;
            margin-bottom: 8px;
            display: block;
            filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.3));
        }

        .game-name {
            font-family: 'Fredoka', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: -0.3px;
        }

        .game-desc {
            font-size: 13px;
            color: #000000;
            font-weight: 600;
        }

        .skip-btn {
            width: 100%;
            padding: 16px;
            background: #FFFFFF;
            border: 4px solid #000000;
            box-shadow: 4px 4px 0 #000000;
            font-family: 'Fredoka', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #000000;
            cursor: pointer;
            transition: all 0.15s ease-out;
            text-transform: uppercase;
        }

        .skip-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #000000;
        }

        .skip-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 #000000;
        }

        @media (max-width: 480px) {
            .modal {
                padding: 24px 16px;
                box-shadow: 6px 6px 0 #000000;
            }

            .title {
                font-size: 24px;
            }

            .games-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }

            .game-card {
                padding: 16px 8px;
                border: 3px solid #000000;
                box-shadow: 3px 3px 0 #000000;
            }

            .game-icon {
                font-size: 36px;
            }

            .game-name {
                font-size: 14px;
            }

            .game-desc {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="modal">
            <div class="title">🎁 任务完成</div>
            <div class="subtitle">选一个游戏玩玩吧！</div>
            
            <div class="games-grid">
                <div class="game-card">
                    <span class="game-icon">🧭</span>
                    <div class="game-name">迷宫</div>
                    <div class="game-desc">找出口</div>
                </div>
                
                <div class="game-card">
                    <span class="game-icon">🐍</span>
                    <div class="game-name">贪食蛇</div>
                    <div class="game-desc">越吃越长</div>
                </div>
                
                <div class="game-card">
                    <span class="game-icon">🐝</span>
                    <div class="game-name">小蜜蜂</div>
                    <div class="game-desc">打飞机</div>
                </div>
            </div>
            
            <button class="skip-btn">稍后再玩</button>
        </div>
    </div>
</body>
</html>
