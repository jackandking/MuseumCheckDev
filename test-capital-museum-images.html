<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首都博物馆图片测试 - Capital Museum Image Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .status {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .status h2 {
            color: #667eea;
            margin-bottom: 15px;
        }
        .status-item {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-item.success {
            background: #d4edda;
            color: #155724;
        }
        .status-item.loading {
            background: #fff3cd;
            color: #856404;
        }
        .status-item.error {
            background: #f8d7da;
            color: #721c24;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }
        .card-image {
            width: 100%;
            height: 300px;
            object-fit: contain;
            background: #f5f5f5;
            padding: 10px;
        }
        .card-body {
            padding: 20px;
        }
        .card-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .card-url {
            font-size: 0.85em;
            color: #999;
            word-break: break-all;
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
        }
        .museum-image {
            width: 100%;
            margin-bottom: 30px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .museum-image img {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }
        .museum-image-caption {
            padding: 20px;
            background: white;
            text-align: center;
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
        }
        .loading-indicator {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>首都博物馆 - 图片更新测试</h1>
        
        <div class="status">
            <h2>📊 图片加载状态</h2>
            <div id="status-container">
                <div class="status-item loading">
                    <span class="loading-indicator"></span>
                    <span>正在加载图片...</span>
                </div>
            </div>
        </div>

        <div class="museum-image">
            <img id="museum-building" src="" alt="首都博物馆建筑">
            <div class="museum-image-caption">首都博物馆建筑外观</div>
        </div>

        <h2 style="color: white; margin-bottom: 20px; text-align: center; font-size: 2em;">镇馆之宝</h2>
        
        <div class="grid" id="treasures-grid"></div>
    </div>

    <script src="museums-data.js"></script>
    <script>
        const statusContainer = document.getElementById('status-container');
        const museumBuilding = document.getElementById('museum-building');
        const treasuresGrid = document.getElementById('treasures-grid');
        
        const imageStatuses = [];
        
        // Load museum data from MUSEUMS array (equivalent to old window.MUSEUM_CAPITAL)
        const museum = window.MUSEUMS && window.MUSEUMS.find(m => m.id === 'beijing-capital-museum');
        
        function updateStatus() {
            const total = imageStatuses.length;
            const loaded = imageStatuses.filter(s => s.status === 'success').length;
            const errors = imageStatuses.filter(s => s.status === 'error').length;
            
            let html = '';
            imageStatuses.forEach(item => {
                const statusClass = item.status;
                const icon = item.status === 'success' ? '✅' : 
                            item.status === 'error' ? '❌' : '⏳';
                html += `
                    <div class="status-item ${statusClass}">
                        <span>${icon}</span>
                        <span>${item.name}: ${item.message}</span>
                    </div>
                `;
            });
            
            if (loaded + errors === total) {
                html += `
                    <div class="status-item ${errors === 0 ? 'success' : 'error'}" style="margin-top: 15px; font-weight: bold;">
                        <span>${errors === 0 ? '🎉' : '⚠️'}</span>
                        <span>加载完成: ${loaded}/${total} 成功, ${errors}/${total} 失败</span>
                    </div>
                `;
            }
            
            statusContainer.innerHTML = html;
        }
        
        function testImage(url, name) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const statusObj = { name, status: 'loading', message: '加载中...' };
                imageStatuses.push(statusObj);
                updateStatus();
                
                img.onload = () => {
                    statusObj.status = 'success';
                    statusObj.message = `成功 (${img.width}x${img.height})`;
                    updateStatus();
                    resolve({ url, name, width: img.width, height: img.height });
                };
                
                img.onerror = () => {
                    statusObj.status = 'error';
                    statusObj.message = '加载失败';
                    updateStatus();
                    reject(new Error(`Failed to load ${name}`));
                };
                
                img.src = url;
            });
        }
        
        async function loadImages() {
            if (!museum) {
                statusContainer.innerHTML = '<div class="status-item error">❌ 无法加载博物馆数据</div>';
                return;
            }
            
            // Test museum building image
            try {
                await testImage(museum.image, '博物馆建筑');
                museumBuilding.src = museum.image;
            } catch (e) {
                console.error('Museum building image failed:', e);
            }
            
            // Test treasure images
            for (let i = 0; i < museum.collections.length; i++) {
                const treasure = museum.collections[i];
                try {
                    await testImage(treasure.imageUrl, treasure.name);
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-header">${treasure.name}</div>
                        <img class="card-image" src="${treasure.imageUrl}" alt="${treasure.name}">
                        <div class="card-body">
                            <div class="card-description">${treasure.description}</div>
                            <div class="card-url">${treasure.imageUrl}</div>
                        </div>
                    `;
                    treasuresGrid.appendChild(card);
                } catch (e) {
                    console.error(`Treasure ${treasure.name} failed:`, e);
                }
            }
        }
        
        loadImages();
    </script>
</body>
</html>
