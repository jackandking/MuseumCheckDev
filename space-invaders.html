<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>经典小蜜蜂射击游戏 - MuseumCheck</title>
    <meta name="description" content="经典小蜜蜂射击游戏，重温童年记忆。控制飞船消灭外星小蜜蜂！">
    
    <!-- Baidu Analytics -->
    <script>
        var _hmt = _hmt || [];
        (function() {
            var hm = document.createElement("script");
            hm.src = "https://hm.baidu.com/hm.js?10856afa2ea23687b7e8f5b901795c57";
            var s = document.getElementsByTagName("script")[0]; 
            s.parentNode.insertBefore(hm, s);
        })();
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            touch-action: none;
        }
        
        #gameContainer {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        #gameCanvas {
            display: block;
            background: #000;
            border: 2px solid #333;
            border-radius: 8px;
        }
        
        .game-header {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            padding: 10px;
        }
        
        .back-link {
            color: #FFD700;
            text-decoration: none;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid #FFD700;
            transition: all 0.3s;
        }
        
        .back-link:hover {
            background: #FFD700;
            color: #000;
        }
        
        .game-info {
            display: flex;
            gap: 20px;
            font-size: 16px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 8px 15px;
            border-radius: 8px;
        }
        
        .game-info span {
            color: #FFD700;
        }
        
        .game-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            z-index: 20;
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #FFD700;
        }
        
        .game-overlay h1 {
            font-size: 2em;
            margin-bottom: 20px;
            color: #FFD700;
        }
        
        .game-overlay p {
            margin: 10px 0;
            font-size: 1.1em;
            line-height: 1.6;
        }
        
        .game-overlay .highlight {
            color: #FFD700;
        }
        
        .start-btn {
            margin-top: 30px;
            padding: 15px 50px;
            font-size: 1.3em;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            color: #000;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        
        .controls-hint {
            margin-top: 20px;
            font-size: 0.9em;
            color: #888;
        }
        
        .controls-hint div {
            margin: 5px 0;
        }
        
        /* Mobile touch controls */
        .touch-controls {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            display: none;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 15;
        }
        
        .touch-btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 215, 0, 0.3);
            border: 2px solid #FFD700;
            border-radius: 50%;
            color: #FFD700;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        
        .touch-btn:active {
            background: rgba(255, 215, 0, 0.6);
        }
        
        .touch-btn-group {
            display: flex;
            gap: 15px;
        }
        
        .fire-btn {
            width: 90px;
            height: 90px;
            font-size: 32px;
        }
        
        @media (max-width: 768px) {
            .touch-controls {
                display: flex;
            }
            
            .game-header {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
            
            .game-info {
                width: 100%;
                justify-content: space-between;
            }
            
            .game-overlay h1 {
                font-size: 1.5em;
            }
            
            .game-overlay {
                padding: 25px;
                width: 90%;
            }
            
            .controls-hint {
                font-size: 0.8em;
            }
        }
        
        /* Game over specific styles */
        .final-score {
            font-size: 3em;
            color: #FFD700;
            margin: 20px 0;
        }
        
        .game-stats {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin: 20px 0;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5em;
            color: #FFD700;
        }
        
        .stat-label {
            font-size: 0.9em;
            color: #888;
        }
        
        /* Hidden class */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="game-header">
            <a href="index.html" class="back-link">← 返回博物馆</a>
            <div class="game-info">
                <div>得分: <span id="scoreDisplay">0</span></div>
                <div>生命: <span id="livesDisplay">3</span></div>
                <div>关卡: <span id="levelDisplay">1</span></div>
            </div>
        </div>
        
        <canvas id="gameCanvas"></canvas>
        
        <!-- Start Screen -->
        <div id="startScreen" class="game-overlay">
            <h1>🐝 经典小蜜蜂 🐝</h1>
            <p>消灭入侵的外星小蜜蜂！</p>
            <p>保卫地球家园！</p>
            <button class="start-btn" onclick="startGame()">开始游戏</button>
            <div class="controls-hint">
                <div>🎮 电脑: ← → 移动 | 空格键 射击</div>
                <div>📱 手机: 点击屏幕下方按钮控制</div>
            </div>
        </div>
        
        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="game-overlay hidden">
            <h1>游戏结束</h1>
            <div class="final-score" id="finalScore">0</div>
            <div class="game-stats">
                <div class="stat-item">
                    <div class="stat-value" id="enemiesKilled">0</div>
                    <div class="stat-label">击杀数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="maxLevel">1</div>
                    <div class="stat-label">最高关卡</div>
                </div>
            </div>
            <button class="start-btn" onclick="restartGame()">再来一局</button>
        </div>
        
        <!-- Level Complete Screen -->
        <div id="levelCompleteScreen" class="game-overlay hidden">
            <h1>🎉 关卡完成！</h1>
            <p>恭喜通过第 <span id="completedLevel" class="highlight">1</span> 关</p>
            <p>准备进入下一关...</p>
        </div>
        
        <!-- Touch Controls for Mobile -->
        <div class="touch-controls" id="touchControls">
            <div class="touch-btn-group">
                <button class="touch-btn" id="leftBtn">◀</button>
                <button class="touch-btn" id="rightBtn">▶</button>
            </div>
            <button class="touch-btn fire-btn" id="fireBtn">🔥</button>
        </div>
    </div>
    
    <script src="space-invaders.js"></script>
</body>
</html>
