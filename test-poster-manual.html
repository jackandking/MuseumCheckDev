<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poster Test - 平湖博物馆</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .test-section {
      background: white;
      padding: 20px;
      margin: 20px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      color: #2e7cf6;
      margin-bottom: 15px;
    }
    button {
      padding: 12px 24px;
      margin: 8px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #2e7cf6;
      color: white;
      font-weight: bold;
    }
    button:hover {
      background: #1d6fe5;
    }
    #posterPreview {
      margin-top: 20px;
      text-align: center;
    }
    #posterPreview img {
      max-width: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .info {
      background: #e3f2fd;
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
      border-left: 4px solid #2e7cf6;
    }
    .status {
      margin: 10px 0;
      padding: 8px;
      border-radius: 6px;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
  </style>
</head>
<body>
  <h1>📸 平湖博物馆海报生成测试</h1>
  
  <div class="test-section">
    <h2>测试说明</h2>
    <div class="info">
      <p><strong>目的：</strong>验证工作流完成后的海报生成功能</p>
      <p><strong>测试场景：</strong>平湖博物馆 - 镇馆之宝探索（5张照片）</p>
      <ul>
        <li>任务1: 门口打卡</li>
        <li>任务2-4: 三件镇馆之宝照片</li>
        <li>任务5: 胜利合影</li>
      </ul>
    </div>
  </div>

  <div class="test-section">
    <h2>步骤1: 模拟照片上传</h2>
    <button onclick="simulateWorkflowPhotos()">📷 模拟上传5张照片</button>
    <div id="photoStatus"></div>
  </div>

  <div class="test-section">
    <h2>步骤2: 生成海报</h2>
    <button onclick="generateTestPoster()">🎨 生成海报</button>
    <div id="posterStatus"></div>
    <canvas id="posterCanvas" width="720" height="1280" style="display:none"></canvas>
    <div id="posterPreview"></div>
  </div>

  <div class="test-section">
    <h2>步骤3: 下载测试</h2>
    <button onclick="testDownload()" id="downloadBtn" disabled>💾 下载海报</button>
    <div id="downloadStatus"></div>
  </div>

  <script>
    // Simulate workflow state
    const state = {
      wfMode: true,
      wfVisitCount: 5,
      selectedMuseum: { name: '平湖博物馆' },
      photos: {}
    };

    // Mock child nickname from localStorage
    function getChildNickname() {
      return '小小探险家';
    }

    // Create test image blobs
    async function createTestImage(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 400;
      canvas.height = 400;
      const ctx = canvas.getContext('2d');
      
      // Background gradient
      const grad = ctx.createLinearGradient(0, 0, 400, 400);
      grad.addColorStop(0, '#ff6b6b');
      grad.addColorStop(1, '#4ecdc4');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 400, 400);
      
      // Text
      ctx.fillStyle = 'white';
      ctx.font = 'bold 48px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 200, 200);
      
      // Convert to blob
      return new Promise(resolve => {
        canvas.toBlob(blob => resolve(blob));
      });
    }

    async function simulateWorkflowPhotos() {
      const status = document.getElementById('photoStatus');
      status.innerHTML = '<div class="status info">正在生成测试照片...</div>';
      
      try {
        // Create 5 test photos
        const tasks = ['门口打卡', '宝藏1/3', '宝藏2/3', '宝藏3/3', '胜利合影'];
        
        for (let i = 0; i < 5; i++) {
          const blob = await createTestImage(tasks[i]);
          const file = new File([blob], `photo-${i}.png`, { type: 'image/png' });
          state.photos[`wf-${i}`] = [file];
        }
        
        status.innerHTML = `
          <div class="status success">
            ✅ 成功生成5张测试照片<br>
            <small>已存储在 state.photos['wf-0'] 到 state.photos['wf-4']</small>
          </div>
        `;
        
        console.log('Photos simulated:', state.photos);
      } catch (err) {
        status.innerHTML = `<div class="status" style="background:#f8d7da;color:#721c24">❌ 错误: ${err.message}</div>`;
      }
    }

    async function generateTestPoster() {
      const status = document.getElementById('posterStatus');
      status.innerHTML = '<div class="status info">正在生成海报...</div>';
      
      try {
        const canvas = document.getElementById('posterCanvas');
        const preview = document.getElementById('posterPreview');
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;
        
        // Background gradient
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#a8d8ea');
        grad.addColorStop(1, '#5ab4d1');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // Title
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 44px -apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC';
        ctx.fillText('今天的博物馆小探险', 40, 100);

        // Museum name
        ctx.font = 'bold 36px -apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC';
        ctx.fillText(state.selectedMuseum.name, 40, 160);

        // Nickname
        ctx.font = '28px -apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC';
        ctx.fillText(`${getChildNickname()} 今天完成了所有挑战！`, 40, 210);

        // Collect workflow photos
        const readAsImage = (file) => new Promise(resolve => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => resolve(null);
          img.src = URL.createObjectURL(file);
        });

        const picks = [];
        for (let i = 0; i < state.wfVisitCount; i++) {
          const key = `wf-${i}`;
          if (state.photos[key] && state.photos[key][0]) {
            picks.push(state.photos[key][0]);
          }
        }

        if (picks.length === 0) {
          status.innerHTML = '<div class="status" style="background:#fff3cd;color:#856404">⚠️ 请先模拟上传照片</div>';
          return;
        }

        const work = picks.map(f => readAsImage(f));
        const images = await Promise.all(work);
        const validImages = images.filter(img => img !== null);

        // Dynamic layout
        const photoCount = validImages.length;
        let startY = 260;
        let photoSize = 180;
        let cols = 3;
        let padding = 12;

        validImages.forEach((img, idx) => {
          const row = Math.floor(idx / cols);
          const col = idx % cols;
          const x = 40 + col * (photoSize + padding);
          const y = startY + row * (photoSize + padding);

          // White border
          ctx.fillStyle = 'rgba(255,255,255,0.6)';
          ctx.fillRect(x - 6, y - 6, photoSize + 12, photoSize + 12);

          // Draw photo with aspect ratio fit
          const scale = Math.min(photoSize / img.width, photoSize / img.height);
          const scaledW = img.width * scale;
          const scaledH = img.height * scale;
          const offsetX = (photoSize - scaledW) / 2;
          const offsetY = (photoSize - scaledH) / 2;

          ctx.drawImage(img, x + offsetX, y + offsetY, scaledW, scaledH);
        });

        // Footer
        const rows = Math.ceil(validImages.length / cols);
        const contentEndY = startY + rows * (photoSize + padding) + 40;
        const footerY = Math.max(contentEndY, H - 60);

        ctx.fillStyle = '#ffffff';
        ctx.font = '24px -apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC';
        const date = new Date().toLocaleDateString('zh-CN');
        ctx.fillText(`MuseumCheck · ${date}`, 40, footerY);

        // Preview
        preview.innerHTML = '';
        const out = new Image();
        out.src = canvas.toDataURL('image/png');
        out.style.maxWidth = '100%';
        out.style.borderRadius = '12px';
        preview.appendChild(out);

        status.innerHTML = `
          <div class="status success">
            ✅ 海报生成成功！<br>
            <small>尺寸: ${W}x${H}px，包含 ${validImages.length} 张照片</small>
          </div>
        `;
        
        document.getElementById('downloadBtn').disabled = false;
        
      } catch (err) {
        status.innerHTML = `<div class="status" style="background:#f8d7da;color:#721c24">❌ 生成失败: ${err.message}</div>`;
        console.error('Poster generation error:', err);
      }
    }

    function testDownload() {
      const status = document.getElementById('downloadStatus');
      try {
        const canvas = document.getElementById('posterCanvas');
        const a = document.createElement('a');
        a.download = 'museum-poster-test.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
        
        status.innerHTML = '<div class="status success">✅ 下载已触发！请检查下载文件夹。</div>';
      } catch (err) {
        status.innerHTML = `<div class="status" style="background:#f8d7da;color:#721c24">❌ 下载失败: ${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
