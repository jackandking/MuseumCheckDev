<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug API Response</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        button {
            padding: 10px 20px;
            margin: 10px 5px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .label {
            font-weight: bold;
            margin-top: 20px;
            color: #374151;
        }
        .status {
            padding: 8px 12px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .success {
            background: #d1fae5;
            color: #065f46;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Debug API Response</h1>
        <p>This page helps debug the leaderboard API response structure</p>
        
        <div>
            <button onclick="testFetchLeaderboard()">Test Fetch Leaderboard</button>
            <button onclick="testFetchRaw()">Test Raw Fetch</button>
            <button onclick="clearResults()">Clear Results</button>
        </div>
        
        <div id="status"></div>
        <div id="results"></div>
    </div>

    <script>
        const API_ENDPOINT = 'https://rlyhccdr2g.execute-api.us-west-2.amazonaws.com/default/keyValueStore';
        const LEADERBOARD_KEY = 'museumcheck-leaderboard';

        function showStatus(message, isError = false) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<div class="status ${isError ? 'error' : 'success'}">${message}</div>`;
        }

        function addResult(label, content) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML += `
                <div class="label">${label}</div>
                <pre>${content}</pre>
            `;
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
            document.getElementById('status').innerHTML = '';
        }

        async function testFetchRaw() {
            clearResults();
            showStatus('Fetching raw data from API...');
            
            try {
                const url = `${API_ENDPOINT}?key=${encodeURIComponent(LEADERBOARD_KEY)}`;
                addResult('🔗 URL:', url);
                
                const response = await fetch(url);
                addResult('📊 Response Status:', `${response.status} ${response.statusText}`);
                
                const rawText = await response.text();
                addResult('📄 Raw Response Text:', rawText);
                
                let parsed;
                try {
                    parsed = JSON.parse(rawText);
                    addResult('✅ Parsed JSON:', JSON.stringify(parsed, null, 2));
                    
                    // Check structure
                    addResult('🔍 Structure Analysis:', 
                        `Has 'items' field: ${parsed.items !== undefined}\n` +
                        `Has 'Items' field: ${parsed.Items !== undefined}\n` +
                        `Type of items: ${typeof parsed.items}\n` +
                        `Is array: ${Array.isArray(parsed.items)}\n` +
                        `Length: ${parsed.items ? parsed.items.length : 'N/A'}\n` +
                        `All keys: ${Object.keys(parsed).join(', ')}`
                    );
                    
                    if (parsed.items && Array.isArray(parsed.items)) {
                        addResult('📦 Items Count:', parsed.items.length.toString());
                        
                        if (parsed.items.length > 0) {
                            const firstItem = parsed.items[0];
                            addResult('🔍 First Item Structure:', 
                                `Keys: ${Object.keys(firstItem).join(', ')}\n\n` +
                                JSON.stringify(firstItem, null, 2)
                            );
                            
                            // Try to parse the value
                            if (firstItem.value) {
                                try {
                                    const parsedValue = JSON.parse(firstItem.value);
                                    addResult('✅ Parsed First Item Value:', JSON.stringify(parsedValue, null, 2));
                                } catch (e) {
                                    addResult('❌ Error Parsing First Item Value:', e.message);
                                }
                            }
                        }
                    } else if (parsed.Items && Array.isArray(parsed.Items)) {
                        addResult('⚠️ Found "Items" (capital I) instead of "items"', 
                            `Count: ${parsed.Items.length}`
                        );
                    }
                    
                } catch (parseError) {
                    addResult('❌ JSON Parse Error:', parseError.message);
                }
                
                showStatus('✅ Fetch completed successfully');
                
            } catch (error) {
                addResult('❌ Error:', error.message);
                showStatus('❌ Error: ' + error.message, true);
            }
        }

        async function testFetchLeaderboard() {
            clearResults();
            showStatus('Fetching leaderboard using app logic...');
            
            try {
                const url = `${API_ENDPOINT}?key=${encodeURIComponent(LEADERBOARD_KEY)}`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`Failed to fetch leaderboard: ${response.status}`);
                }
                
                const result = await response.json();
                addResult('📊 API Response:', JSON.stringify(result, null, 2));
                
                // Parse entries (same logic as script.js)
                const entries = [];
                if (result.items && Array.isArray(result.items)) {
                    for (const item of result.items) {
                        try {
                            const data = JSON.parse(item.value);
                            entries.push(data);
                        } catch (e) {
                            console.warn('Failed to parse leaderboard entry:', e);
                        }
                    }
                }
                
                addResult('📦 Parsed Entries:', 
                    `Count: ${entries.length}\n\n` +
                    JSON.stringify(entries, null, 2)
                );
                
                showStatus(`✅ Found ${entries.length} leaderboard entries`);
                
            } catch (error) {
                addResult('❌ Error:', error.message);
                showStatus('❌ Error: ' + error.message, true);
            }
        }

        // Auto-run on load
        window.addEventListener('load', () => {
            showStatus('Ready to debug. Click a button to test the API.');
        });
    </script>
</body>
</html>
