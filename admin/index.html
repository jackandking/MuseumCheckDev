<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>网站管理后台</title>
  <meta name="robots" content="noindex,nofollow" />
  
  <!-- Cache busting meta tags -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <!-- Baidu Analytics (百度统计) -->
  <script>
    var _hmt = _hmt || [];
    (function() {
      var hm = document.createElement("script");

  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; 
      margin: 16px; 
      color: #111; 
      background: #f9fafb; 
    }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .unauthorized { 
      padding: 24px; 
      background: #fff5f5; 
      border: 1px solid #fecaca; 
      color: #991b1b; 
      border-radius: 8px; 
    }
    .panel { 
      border: 1px solid #e5e7eb; 
      border-radius: 8px; 
      padding: 16px; 
      margin-bottom: 16px; 
      background: #fff; 
    }
    .panel-header {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .row > * { margin: 4px 0; }
    button { 
      padding: 8px 12px; 
      border: 1px solid #d1d5db; 
      background: #f9fafb; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 14px; 
    }
    button.primary { background: #2563eb; color: #fff; border-color: #1d4ed8; }
    button.danger { background: #dc2626; color: #fff; border-color: #b91c1c; }
    button.success { background: #059669; color: #fff; border-color: #047857; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eee; vertical-align: middle; }
    th { background: #f9fafb; position: sticky; top: 0; z-index: 1; font-weight: 600; }
    .tag { 
      display: inline-block; 
      font-size: 12px; 
      padding: 2px 8px; 
      border-radius: 999px; 
      background: #f3f4f6; 
      border: 1px solid #e5e7eb; 
      margin-right: 6px; 
    }
    .tag.active { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
    .tag.inactive { background: #f3f4f6; border-color: #e5e7eb; color: #6b7280; }
    .muted { color: #6b7280; font-size: 13px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; font-size: 13px; }
    .flex { display: flex; gap: 8px; align-items: center; }
    .sticky-actions { position: sticky; top: 8px; z-index: 5; background: #f9fafb; padding-bottom: 8px; }
    input[type="text"], select {
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
    }
    input[type="text"] { width: 200px; }
    select { min-width: 150px; }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-group label {
      font-size: 13px;
      color: #374151;
      font-weight: 500;
    }
    .add-form {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: flex-end;
      padding: 16px;
      background: #f9fafb;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .nav-links {
      margin-bottom: 12px; 
      font-size: 13px; 
      color: #6b7280;
    }
    .nav-links a {
      color: #2563eb; 
      text-decoration: none;
      margin-right: 16px;
    }
    .nav-links a:hover {
      text-decoration: underline;
    }
    /* Admin Dashboard Card Grid */
    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }
    .admin-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 24px;
      transition: all 0.2s ease;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }
    .admin-card:hover {
      border-color: #3b82f6;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
      transform: translateY(-2px);
    }
    .admin-card-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .admin-card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #111;
    }
    .admin-card-desc {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.5;
      flex-grow: 1;
    }
    .admin-card-badge {
      font-size: 12px;
      background: #f0f9ff;
      color: #0369a1;
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 12px;
      width: fit-content;
    }
    .description {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .preview-link {
      color: #2563eb;
      text-decoration: none;
      font-size: 13px;
    }
    .preview-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>🛠️ 网站管理后台</h1>
  
  <!-- Admin Navigation Cards -->
  <div class="admin-grid">
    <a href="museum-data-manager.html" class="admin-card">
      <div class="admin-card-icon">📚</div>
      <div class="admin-card-title">博物馆数据管理</div>
      <div class="admin-card-desc">编辑博物馆信息、镇馆之宝、收藏品和图片。所有修改直接保存到KV Store。</div>
      <div class="admin-card-badge">核心工具</div>
    </a>
    
    <a href="admin-everyone-achievements.html?admin=1" class="admin-card">
      <div class="admin-card-icon">🏆</div>
      <div class="admin-card-title">成就管理</div>
      <div class="admin-card-desc">管理用户成就和荣誉，查看全站成就统计，发布成就公告。</div>
      <div class="admin-card-badge">常用工具</div>
    </a>
    
    <a href="admin-leaderboard.html?admin=1" class="admin-card">
      <div class="admin-card-icon">🏅</div>
      <div class="admin-card-title">排行榜管理</div>
      <div class="admin-card-desc">查看用户排名，编辑排行榜规则，管理荣誉排行榜数据。</div>
      <div class="admin-card-badge">常用工具</div>
    </a>
    
    <a href="admin-fireworks.html?admin=1" class="admin-card">
      <div class="admin-card-icon">🎆</div>
      <div class="admin-card-title">烟花墙管理</div>
      <div class="admin-card-desc">管理用户在烟花墙上的庆贺信息，审核、编辑或删除用户提交的烟花消息。</div>
      <div class="admin-card-badge">常用工具</div>
    </a>
    
    <a href="admin-treasure-reports.html?admin=1" class="admin-card">
      <div class="admin-card-icon">⚠️</div>
      <div class="admin-card-title">镇馆之宝报告</div>
      <div class="admin-card-desc">查看所有博物馆镇馆之宝的统计信息，发现缺失的图片和信息。</div>
      <div class="admin-card-badge">分析工具</div>
    </a>
    
    <a href="admin-records.html?admin=1" class="admin-card" style="opacity: 0.6;">
      <div class="admin-card-icon">📝</div>
      <div class="admin-card-title">访问记录</div>
      <div class="admin-card-desc">查看用户访问日志和操作记录，分析用户行为数据。</div>
      <div class="admin-card-badge">计划中</div>
    </a>
  </div>
</body>
</html>
