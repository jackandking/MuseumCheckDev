<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的成就 - 博物馆打卡</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="查看您在博物馆打卡应用中获得的所有成就海报">
    
    <!-- Use main site CSS for consistent UX -->
    <link rel="stylesheet" href="css/style.css">
    <script src="js/debug-mode.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif);
            background-color: var(--background-color, #F0FDFA);
            min-height: 100vh;
            padding: 0;
        }

        /* Page-specific styles that extend main CSS */
        .achievements-page .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Override header for achievements page */
        .achievements-page header {
            margin-bottom: 30px;
        }

        .achievements-page header h1 {
            color: var(--primary-color, #0D9488);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .refresh-button {
            width: 44px;
            height: 44px;
            background: var(--white, white);
            border: 2px solid var(--border-color, #5EEAD4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.2s ease;
        }

        .refresh-button:hover {
            background: var(--hover-color, #CCFBF1);
            transform: scale(1.05);
        }

        .link-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--white, white);
            color: var(--primary-color, #0D9488);
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 14px;
            border: 2px solid var(--border-color, #5EEAD4);
            transition: all 0.2s ease;
        }

        .link-button:hover {
            background: var(--hover-color, #CCFBF1);
            transform: translateY(-2px);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            /* Override sticky positioning from main CSS - not needed on achievements page */
            position: static;
        }

        .stat-card {
            background: var(--white, white);
            border: 1px solid var(--border-color, #5EEAD4);
            padding: 20px;
            border-radius: 12px;
            flex: 1;
            min-width: 200px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .stat-card .stat-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .stat-card .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary-color, #0D9488);
            margin-bottom: 5px;
        }

        .stat-card .stat-label {
            font-size: 14px;
            color: var(--text-muted, #14B8A6);
        }

        .posters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .poster-item {
            background: var(--white, white);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color, #5EEAD4);
        }

        .poster-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(13, 148, 136, 0.15);
            border-color: var(--primary-color, #0D9488);
        }

        .poster-thumbnail {
            width: 100%;
            aspect-ratio: 9/16;
            object-fit: cover;
            background: #f0f0f0;
        }

        .poster-info {
            padding: 15px;
        }

        .poster-museum-name {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-color, #134E4A);
            margin-bottom: 5px;
        }

        .poster-date {
            font-size: 14px;
            color: var(--text-muted, #14B8A6);
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: var(--white, white);
            border: 1px solid var(--border-color, #5EEAD4);
            border-radius: 15px;
            margin: 40px auto;
            max-width: 500px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .empty-state h2 {
            color: var(--text-color, #134E4A);
            font-size: 24px;
            margin-bottom: 15px;
        }

        .empty-state p {
            color: var(--text-muted, #14B8A6);
            font-size: 16px;
            line-height: 1.6;
        }

        .empty-state .start-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: var(--btn-primary-bg, linear-gradient(45deg, #ff6b6b, #ffa500));
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: transform 0.2s;
            box-shadow: var(--btn-primary-shadow, 0 4px 15px rgba(255, 107, 107, 0.3));
        }

        .empty-state .start-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--btn-primary-hover-shadow, 0 6px 20px rgba(255, 107, 107, 0.4));
        }

        /* Full-size viewer modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            width: 40px;
            height: 40px;
            background: white;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-image {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .modal-info {
            margin-top: 20px;
            text-align: center;
            color: white;
        }

        .modal-info h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .modal-info p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .modal-button {
            padding: 12px 24px;
            background: var(--white, white);
            color: var(--primary-color, #0D9488);
            border: 2px solid var(--border-color, #5EEAD4);
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-button:hover {
            background: var(--hover-color, #CCFBF1);
            transform: translateY(-2px);
        }

        .modal-button.primary {
            background: var(--btn-primary-bg, linear-gradient(45deg, #ff6b6b, #ffa500));
            color: white;
            border: none;
            box-shadow: var(--btn-primary-shadow, 0 4px 15px rgba(255, 107, 107, 0.3));
        }

        .modal-button.primary:hover {
            box-shadow: var(--btn-primary-hover-shadow, 0 6px 20px rgba(255, 107, 107, 0.4));
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .stats {
                gap: 10px;
            }

            .stat-card {
                min-width: 150px;
                padding: 15px;
            }

            .stat-card .stat-icon {
                font-size: 28px;
            }

            .stat-card .stat-value {
                font-size: 24px;
            }

            .posters-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
            }

            .link-button {
                padding: 8px 12px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .achievements-page header h1 {
                font-size: 1em;
            }

            .header-actions {
                gap: 8px;
            }

            .link-button {
                padding: 6px 10px;
                font-size: 12px;
            }

            .link-button span.link-text {
                display: none;
            }

            .posters-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <script src="js/debug-mode.js"></script>
</head>
<body class="achievements-page">
    <div class="container">
        <!-- Header - matches main page structure -->
        <header>
            <h1>
                <button class="menu-button" onclick="goBack()" title="返回首页">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="menu-icon">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                    </svg>
                </button>
                <span>🏆 我的成就</span>
                <div class="header-actions">
                    <a class="link-button" href="everyone-achievements.html" title="查看大家的成就">👥 <span class="link-text">大家的成就</span></a>
                    <button class="refresh-button" onclick="refreshPosters()" title="刷新加载成就海报">🔄</button>
                </div>
            </h1>
        </header>

        <!-- Stats Cards -->
        <div class="stats" id="statsContainer">
            <div class="stat-card">
                <div class="stat-icon">🎨</div>
                <div class="stat-value" id="posterCount">0</div>
                <div class="stat-label">成就海报</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🏛️</div>
                <div class="stat-value" id="museumCount">0</div>
                <div class="stat-label">参观博物馆</div>
            </div>
        </div>

        <!-- Posters Grid -->
        <div class="posters-grid" id="postersGrid">
            <!-- Posters will be loaded here dynamically -->
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon">🎨</div>
            <h2>还没有成就海报</h2>
            <p>完成博物馆的探索任务后，系统会自动生成精美的成就海报</p>
            <p>快去探索博物馆吧！</p>
            <a href="index.html" class="start-button">开始探索</a>
        </div>
    </div>

    <!-- Full-size Viewer Modal -->
    <div class="modal" id="viewerModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeViewer()">×</button>
            <img class="modal-image" id="viewerImage" src="" alt="海报">
            <div class="modal-info">
                <h3 id="viewerTitle">博物馆名称</h3>
                <p id="viewerDate">生成日期</p>
            </div>
            <div class="modal-actions">
                <button class="modal-button primary" id="publishButton" onclick="publishPosterToEveryone()">📣 发布到大家的成就</button>
                <button class="modal-button" onclick="downloadPoster()">📱 下载海报</button>
                <button class="modal-button" onclick="sharePoster()">📤 分享海报</button>
            </div>
        </div>
    </div>

    <script src="config/api-endpoints.js"></script>
    <script src="js/letmetry-cloud-api.js"></script>
    <script src="js/image-upload-util.js"></script>

    <script>
        // Global variables
        let currentPoster = null;
        let postersData = {};

        // Initialize page
        function init() {
            loadPosters();
            renderPosters();
        }

        // Refresh posters from localStorage
        function refreshPosters() {
            console.log('🔄 Refreshing posters...');
            
            // Add rotation animation
            const btn = event.target.closest('.refresh-button');
            if (btn) {
                btn.style.animation = 'spin 0.6s linear';
                setTimeout(() => {
                    btn.style.animation = '';
                }, 600);
            }
            
            // Reload and re-render
            loadPosters();
            renderPosters();
            
            console.log('✅ Refresh complete');
        }

        // Load posters from localStorage
        function loadPosters() {
            try {
                const raw = localStorage.getItem('museumPosters');
                try {
                    postersData = raw ? JSON.parse(raw) : {};
                } catch (e) {
                    console.error('[achievements.loadPosters] Failed to parse museumPosters JSON:', e);
                    postersData = {};
                }

                console.log('[achievements.loadPosters] ✅ Loaded:', Object.keys(postersData).length, 'posters');

                // If no posters found, log available storage keys for debugging
                if (Object.keys(postersData).length === 0) {
                    console.warn('[achievements.loadPosters] ⚠️ No posters found in localStorage');
                }
            } catch (error) {
                console.error('Error loading posters:', error);
                postersData = {};
            }
        }

        // Render posters grid
        function renderPosters() {
            const grid = document.getElementById('postersGrid');
            const emptyState = document.getElementById('emptyState');
            const posterEntries = Object.entries(postersData);

            // Update stats
            document.getElementById('posterCount').textContent = posterEntries.length;
            document.getElementById('museumCount').textContent = posterEntries.length;

            // Show empty state or grid
            if (posterEntries.length === 0) {
                grid.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            emptyState.style.display = 'none';

            // Clear existing content
            grid.innerHTML = '';

            // Sort by timestamp (newest first)
            posterEntries.sort((a, b) => b[1].timestamp - a[1].timestamp);

            // Render each poster
            posterEntries.forEach(([museumId, posterInfo]) => {
                const posterItem = document.createElement('div');
                posterItem.className = 'poster-item';
                posterItem.onclick = () => openViewer(posterInfo);

                posterItem.innerHTML = `
                    <img src="${posterInfo.dataURL}" alt="${posterInfo.museumName}" class="poster-thumbnail">
                    <div class="poster-info">
                        <div class="poster-museum-name">${posterInfo.museumName}</div>
                        <div class="poster-date">${posterInfo.date}</div>
                    </div>
                `;

                grid.appendChild(posterItem);
            });
        }

        // Open full-size viewer
        function openViewer(posterInfo) {
            currentPoster = posterInfo;
            
            const modal = document.getElementById('viewerModal');
            const image = document.getElementById('viewerImage');
            const title = document.getElementById('viewerTitle');
            const date = document.getElementById('viewerDate');

            image.src = posterInfo.dataURL;
            title.textContent = posterInfo.museumName;
            date.textContent = `生成于 ${posterInfo.date}`;

            modal.classList.add('show');

            // Track event (if analytics available)
            if (typeof gtag === 'function') {
                gtag('event', 'achievement_poster_viewed', {
                    museum_id: posterInfo.museumId,
                    museum_name: posterInfo.museumName
                });
            }
        }

        // Close viewer
        function closeViewer() {
            const modal = document.getElementById('viewerModal');
            modal.classList.remove('show');
            currentPoster = null;
        }

        // Download poster
        function downloadPoster() {
            if (!currentPoster) return;

            const link = document.createElement('a');
            link.download = `${currentPoster.museumId || 'poster'}_打卡海报_${currentPoster.date.replace(/\//g, '-')}.png`;
            link.href = currentPoster.dataURL;
            link.click();

            // Track event
            if (typeof gtag === 'function') {
                gtag('event', 'achievement_poster_downloaded', {
                    museum_id: currentPoster.museumId,
                    museum_name: currentPoster.museumName
                });
            }
        }

        // Share poster
        async function sharePoster() {
            if (!currentPoster) return;

            try {
                // Convert data URL to blob
                const response = await fetch(currentPoster.dataURL);
                const blob = await response.blob();
                
                // Check if Web Share API is available
                if (navigator.share && navigator.canShare) {
                    const files = [new File([blob], `${currentPoster.museumName}_打卡海报.png`, { type: 'image/png' })];
                    
                    if (navigator.canShare({ files })) {
                        await navigator.share({
                            files: files,
                            title: `${currentPoster.museumName}打卡海报`,
                            text: `我完成了${currentPoster.museumName}的探索任务！`
                        });
                        
                        // Track event
                        if (typeof gtag === 'function') {
                            gtag('event', 'achievement_poster_shared', {
                                museum_id: currentPoster.museumId,
                                museum_name: currentPoster.museumName,
                                method: 'native_share'
                            });
                        }
                        return;
                    }
                }
                
                // Fallback: Copy image or show message
                alert('请长按图片保存到相册，然后分享到社交媒体');
                
            } catch (error) {
                console.error('Share failed:', error);
                alert('分享功能暂不可用，请截图分享');
            }
        }

        // Publish poster to letmetry.cloud -> everyone achievements
        async function publishPosterToEveryone() {
            if (!currentPoster) return;
            const btn = document.getElementById('publishButton');
            const origText = btn ? btn.textContent : '';
            try {
                if (btn) { btn.disabled = true; btn.textContent = '发布中...'; }

                // user name fallback
                const userName = localStorage.getItem('museumcheck_user_name') || localStorage.getItem('profileName') || '匿名';

                // Generate unique filename to avoid 409 conflicts
                // Format: museumId_userId_timestamp.png
                // Using museumId instead of Chinese name to avoid URL-encoding issues
                const userId = localStorage.getItem('userId') || 
                              localStorage.getItem('museumcheck_user_id') || 
                              `user_${Math.random().toString(36).substring(2, 11)}`;
                const timestamp = Date.now();
                const museumIdForFilename = (currentPoster.museumId || 'poster');
                const uniqueFilename = `${museumIdForFilename}_${userId}_${timestamp}.png`;

                // Convert dataURL to blob
                const resp = await fetch(currentPoster.dataURL);
                const blob = await resp.blob();
                let file = new File([blob], uniqueFilename, { type: blob.type || 'image/png' });

                // Upload via the official image upload endpoint with retry on 409 conflict
                let imageUrl;
                let uploadAttempts = 0;
                const MAX_UPLOAD_ATTEMPTS = 3;
                
                while (uploadAttempts < MAX_UPLOAD_ATTEMPTS) {
                    try {
                        imageUrl = await imageUploader.uploadImage(file, { compress: true });
                        if (!imageUrl) throw new Error('上传未返回图片地址');
                        break; // Success, exit retry loop
                    } catch (uploadError) {
                        uploadAttempts++;
                        
                        // Check if it's a 409 conflict error
                        const is409 = uploadError.message && uploadError.message.includes('409');
                        const isConflict = is409 || 
                                         uploadError.message && uploadError.message.toLowerCase().includes('conflict');
                        
                        if (isConflict && uploadAttempts < MAX_UPLOAD_ATTEMPTS) {
                            console.warn(`Upload attempt ${uploadAttempts} failed with conflict, retrying...`);
                            // Generate new filename with additional random suffix
                            const retryFilename = `${museumIdForFilename}_${userId}_${timestamp}_retry${uploadAttempts}_${Math.random().toString(36).substring(2, 8)}.png`;
                            file = new File([blob], retryFilename, { type: blob.type || 'image/png' });
                            continue; // Retry
                        }
                        
                        // Not a conflict error or max retries reached
                        if (is409) {
                            throw new Error('文件名冲突，已尝试多次仍然失败。请稍后重试或联系管理员。');
                        }
                        throw uploadError;
                    }
                }

                // Publish poster record to MySQL (achievement_posters) via Letmetry API if available
                const title = `${currentPoster.museumName || '打卡'} 海报`;
                if (LetmetryAPI && LetmetryAPI.insertRecord) {
                    try {
                        const rawImageUrl = (typeof imageUrl === 'object' && imageUrl.url) ? imageUrl.url : imageUrl;
                        const safeImageUrl = (typeof rawImageUrl === 'string') ? encodeURI(rawImageUrl) : rawImageUrl;
                        const record = {
                            image_url: safeImageUrl,
                            title: title,
                            user_name: userName,
                            source: 'museumcheck_web',
                            visibility: 'public',
                            metadata: JSON.stringify({ museumId: currentPoster.museumId, museumName: currentPoster.museumName, date: currentPoster.date }),
                            status: 'active'
                        };
                        await LetmetryAPI.insertRecord('achievement_posters', record);
                    } catch (dbError) {
                        // Check if it's a "table doesn't exist" error (case-insensitive)
                        const errorMsg = (dbError.message || dbError.sqlMessage || String(dbError)).toLowerCase();
                        const isTableMissing = errorMsg.includes("doesn't exist") || 
                                             errorMsg.includes("unknown column") ||
                                             (errorMsg.includes("table") && errorMsg.includes("not found"));
                        
                        if (isTableMissing) {
                            console.error('Database table not initialized:', dbError);
                            throw new Error(
                                '数据库表未初始化。\n\n' +
                                '请联系管理员运行以下命令初始化数据库：\n' +
                                'node init-achievement-posters-table.js\n\n' +
                                '您的海报图片已成功上传，但未能保存到数据库记录。'
                            );
                        }
                        
                        console.warn('insertRecord failed, continuing with uploaded image only', dbError);
                    }
                } else if (LetmetryAPI && LetmetryAPI.publishPoster) {
                    // Legacy fallback: call publishPoster if insertRecord not available
                    try {
                        await LetmetryAPI.publishPoster({ imageUrl, title, userName });
                    } catch (e) {
                        console.warn('publishPoster API failed, continuing with uploaded image only', e);
                    }
                }

                alert('已成功发布到大家的成就！感谢分享。');

                if (confirm('是否打开「大家的成就」查看？')) {
                    window.open('everyone-achievements.html', '_blank');
                }

                if (typeof gtag === 'function') {
                    gtag('event', 'achievement_poster_published', {
                        museum_id: currentPoster.museumId,
                        museum_name: currentPoster.museumName
                    });
                }

            } catch (err) {
                console.error('Publish failed:', err);
                alert('发布失败：' + (err.message || err));
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = origText; }
            }
        }

        // Go back to main page
        function goBack() {
            window.location.href = 'index.html';
        }

        // Close modal when clicking outside
        document.getElementById('viewerModal').addEventListener('click', (e) => {
            if (e.target.id === 'viewerModal') {
                closeViewer();
            }
        });

        // Initialize on page load
        init();
    </script>
