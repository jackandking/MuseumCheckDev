<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>博物馆数据管理 | MuseumCheck</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Helvetica,Arial; background:#f7f9fb; color:#2c3e50; margin:0; padding:0;}
    .wrap{max-width:1400px;margin:0 auto;padding:16px}
    .header{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:20px;margin-bottom:16px}
    .title{font-size:24px;font-weight:800;margin:0 0 8px}
    .subtitle{font-size:14px;color:#667;margin:0}
    .card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:20px;margin-bottom:16px}
    .section-title{font-size:18px;font-weight:700;margin:0 0 16px;padding-bottom:12px;border-bottom:2px solid #eef2f6}
    .actions{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
    .btn{padding:10px 16px;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;transition:all 0.2s}
    .btn-primary{background:linear-gradient(135deg,#2c5aa0,#5b8bd9);color:#fff}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(44,90,160,0.3)}
    .btn-secondary{background:#eef2f6;color:#2c3e50}
    .btn-secondary:hover{background:#dde5ed}
    .btn-danger{background:linear-gradient(135deg,#dc3545,#e74c3c);color:#fff}
    .btn-danger:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(220,53,69,0.3)}
    .btn-success{background:linear-gradient(135deg,#28a745,#5cb85c);color:#fff}
    .btn-success:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(40,167,69,0.3)}
    .btn-sm{padding:6px 12px;font-size:13px}
    .museum-list{display:grid;gap:12px}
    .museum-item{background:#f8f9fa;border-radius:10px;padding:16px;display:flex;justify-content:space-between;align-items:center;transition:all 0.2s}
    .museum-item:hover{background:#e9ecef;transform:translateX(4px)}
    .museum-info{flex:1}
    .museum-name{font-size:16px;font-weight:600;color:#2c3e50;margin:0 0 4px}
    .museum-meta{font-size:13px;color:#667}
    .museum-actions{display:flex;gap:8px}
    .form-group{margin-bottom:16px}
    label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:#2c3e50}
    input, select, textarea{width:100%;padding:10px;border-radius:10px;border:2px solid #dee2e6;font-size:14px;font-family:inherit;box-sizing:border-box}
    textarea{min-height:400px;font-family:monospace;font-size:13px}
    .hint{font-size:13px;color:#667;margin-top:6px}
    .status{padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:16px}
    .status-success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
    .status-error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
    .status-info{background:#d1ecf1;color:#0c5460;border:1px solid #bee5eb}
    .loading{text-align:center;padding:40px;color:#667}
    .tier-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;margin-left:8px}
    .tier-1{background:#d4edda;color:#155724}
    .tier-2{background:#fff3cd;color:#856404}
    .tier-3{background:#d1ecf1;color:#0c5460}
    .empty-state{text-align:center;padding:60px 20px;color:#667}
    .empty-state-icon{font-size:48px;margin-bottom:16px}
    .tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:2px solid #eef2f6}
    .tab{padding:10px 20px;border:none;background:none;cursor:pointer;font-size:14px;font-weight:600;color:#667;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.2s}
    .tab.active{color:#2c5aa0;border-bottom-color:#2c5aa0}
    .tab:hover{color:#2c5aa0}
    .tab-content{display:none}
    .tab-content.active{display:block}
    .editor-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .preview-section{background:#f8f9fa;padding:16px;border-radius:10px}
    .preview-title{font-size:16px;font-weight:600;margin:0 0 12px;color:#2c3e50}
    .preview-image{max-width:100%;height:auto;border-radius:8px;margin:8px 0}
    .collection-item{background:#fff;padding:12px;border-radius:8px;margin-bottom:12px}
    .collection-name{font-weight:600;margin:0 0 8px}
    .json-editor{display:none}
    .structured-editor{display:block}
    .field-row{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start;margin-bottom:12px}
    .field-label{font-weight:600;padding-top:10px}
    .array-item{background:#f8f9fa;padding:12px;border-radius:8px;margin-bottom:8px;position:relative}
    .array-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .remove-btn{padding:4px 8px;font-size:12px;background:#dc3545;color:#fff;border:none;border-radius:4px;cursor:pointer}
    .add-btn{padding:8px 16px;font-size:13px;background:#28a745;color:#fff;border:none;border-radius:8px;cursor:pointer;margin-top:8px}
    @media (max-width: 1200px) {
      .editor-layout{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1 class="title">博物馆数据管理</h1>
      <p class="subtitle">管理远程存储（Tier 2）中的博物馆数据，用于开发和调试</p>
    </div>

    <div class="card">
      <div class="section-title">快速操作</div>
      <div class="actions">
        <button id="refreshBtn" class="btn btn-primary">🔄 刷新列表</button>
        <button id="uploadBtn" class="btn btn-success">📤 上传新数据</button>
        <button id="backBtn" class="btn btn-secondary">← 返回设置</button>
      </div>
    </div>

    <div id="statusMsg"></div>

    <div class="card">
      <div class="section-title">远程存储（Tier 2）中的博物馆</div>
      <div id="museumList" class="museum-list">
        <div class="loading">正在加载...</div>
      </div>
    </div>

    <div class="card" id="uploadCard" style="display:none;">
      <div class="section-title">上传/编辑博物馆数据</div>
      
      <div class="form-group">
        <label for="museumIdSelect">选择博物馆 *</label>
        <select id="museumIdSelect">
          <option value="">-- 选择已有博物馆或新建 --</option>
          <option value="__new__">➕ 创建新博物馆</option>
        </select>
        <div class="hint">从列表选择博物馆将自动加载现有数据</div>
      </div>

      <div class="form-group" id="customIdGroup" style="display:none;">
        <label for="customMuseumId">自定义博物馆 ID *</label>
        <input type="text" id="customMuseumId" placeholder="例如: forbidden-city" />
        <div class="hint">使用小写字母和连字符，例如: forbidden-city, national-museum</div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="structured">📝 结构化编辑</button>
        <button class="tab" data-tab="json">📄 JSON 编辑</button>
        <button class="tab" data-tab="preview">👁️ 预览</button>
      </div>

      <div class="tab-content active" id="structured-tab">
        <div class="structured-editor">
          <h3>基本信息</h3>
          <div class="field-row">
            <div class="field-label">博物馆名称:</div>
            <input type="text" id="edit-name" placeholder="例如: 故宫博物院" />
          </div>
          <div class="field-row">
            <div class="field-label">所在城市:</div>
            <input type="text" id="edit-location" placeholder="例如: 北京" />
          </div>
          <div class="field-row">
            <div class="field-label">简介:</div>
            <textarea id="edit-description" rows="3" placeholder="博物馆简介"></textarea>
          </div>
          <div class="field-row">
            <div class="field-label">主图URL:</div>
            <input type="text" id="edit-image" placeholder="图片URL" />
          </div>
          <div class="field-row">
            <div class="field-label">标签:</div>
            <input type="text" id="edit-tags" placeholder="标签，用逗号分隔，例如: 历史,建筑,文物" />
          </div>

          <h3>馆藏精品</h3>
          <div id="collections-editor"></div>
          <button class="add-btn" onclick="addCollection()">➕ 添加馆藏</button>

          <h3>参观路线 (Workflows)</h3>
          <div id="workflows-editor"></div>
          <button class="add-btn" onclick="addWorkflow()">➕ 添加路线</button>
        </div>
      </div>

      <div class="tab-content" id="json-tab">
        <div class="json-editor">
          <div class="form-group">
            <label for="museumDataJson">博物馆数据 (JSON)</label>
            <textarea id="museumDataJson" placeholder='{"id":"forbidden-city","name":"故宫博物院",...}'></textarea>
            <div class="hint">完整的 JSON 数据，包含所有字段</div>
          </div>
          <button type="button" class="btn btn-secondary" onclick="syncFromJson()">⬅️ 从JSON同步到结构化编辑</button>
        </div>
      </div>

      <div class="tab-content" id="preview-tab">
        <div class="preview-section" id="preview-content">
          <p class="hint">加载博物馆数据后可在此预览</p>
        </div>
      </div>

      <div class="form-group" style="margin-top:20px;">
        <label for="expireAt">过期时间</label>
        <select id="expireAt">
          <option value="permanent">永久保存</option>
          <option value="1day">1 天后过期</option>
          <option value="7days">7 天后过期</option>
          <option value="30days">30 天后过期</option>
        </select>
        <div class="hint">数据过期后会自动删除</div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-success" onclick="submitMuseumData()">✓ 提交</button>
        <button type="button" id="cancelUploadBtn" class="btn btn-secondary">✕ 取消</button>
        <button type="button" class="btn btn-secondary" onclick="validateData()">🔍 验证数据</button>
      </div>
    </div>
  </div>

  <script src="museums-meta.js"></script>
  <script src="museums-data.js"></script>
  <script src="museum-data-loader.js"></script>
  <script>
    (function(){
      const loader = new MuseumDataLoader();
      let currentMuseums = [];
      let currentData = null;

      // Initialize museum ID selector
      function initMuseumSelector() {
        const select = document.getElementById('museumIdSelect');
        if (typeof MUSEUMS_META !== 'undefined') {
          MUSEUMS_META.forEach(museum => {
            const option = document.createElement('option');
            option.value = museum.id;
            option.textContent = `${museum.name} (${museum.id})`;
            select.appendChild(option);
          });
        }
      }

      // Handle museum selection
      document.getElementById('museumIdSelect').addEventListener('change', async function(e) {
        const museumId = e.target.value;
        const customIdGroup = document.getElementById('customIdGroup');
        
        if (museumId === '__new__') {
          customIdGroup.style.display = 'block';
          clearEditorsData();
        } else if (museumId) {
          customIdGroup.style.display = 'none';
          await loadMuseumData(museumId);
        } else {
          customIdGroup.style.display = 'none';
          clearEditorsData();
        }
      });

      // Tab switching
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', function() {
          const tabName = this.dataset.tab;
          
          // Update tab buttons
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          this.classList.add('active');
          
          // Update tab content
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          document.getElementById(tabName + '-tab').classList.add('active');
          
          // Update preview when switching to preview tab
          if (tabName === 'preview') {
            updatePreview();
          }
        });
      });

      // Load museum data from all tiers
      async function loadMuseumData(museumId) {
        showStatus('正在加载博物馆数据...', 'info');
        
        try {
          const data = await loader.loadMuseum(museumId, false);
          
          if (!data) {
            showStatus('未找到博物馆数据，将创建新数据', 'info');
            currentData = {
              id: museumId,
              name: '',
              location: '',
              description: '',
              tags: [],
              image: '',
              collections: [],
              workflows: [],
              checklists: { parent: {}, child: {} }
            };
          } else {
            currentData = data;
            showStatus(`成功加载博物馆数据: ${data.name}`, 'success');
          }
          
          populateEditors(currentData);
          updatePreview();
        } catch (error) {
          showStatus('加载失败: ' + error.message, 'error');
          console.error('Load error:', error);
        }
      }

      // Populate all editors with data
      function populateEditors(data) {
        // Basic info
        document.getElementById('edit-name').value = data.name || '';
        document.getElementById('edit-location').value = data.location || '';
        document.getElementById('edit-description').value = data.description || '';
        document.getElementById('edit-image').value = data.image || '';
        document.getElementById('edit-tags').value = (data.tags || []).join(', ');
        
        // JSON editor
        document.getElementById('museumDataJson').value = JSON.stringify(data, null, 2);
        
        // Collections editor
        renderCollectionsEditor(data.collections || []);
        
        // Workflows editor
        renderWorkflowsEditor(data.workflows || []);
      }

      // Render collections editor
      function renderCollectionsEditor(collections) {
        const editor = document.getElementById('collections-editor');
        editor.innerHTML = collections.map((col, index) => `
          <div class="array-item" data-index="${index}">
            <div class="array-item-header">
              <strong>馆藏 #${index + 1}</strong>
              <button class="remove-btn" onclick="removeCollection(${index})">删除</button>
            </div>
            <div class="field-row">
              <div class="field-label">名称:</div>
              <input type="text" class="col-name" value="${col.name || ''}" placeholder="文物名称" />
            </div>
            <div class="field-row">
              <div class="field-label">图片URL:</div>
              <input type="text" class="col-image" value="${col.imageUrl || ''}" placeholder="图片URL" />
            </div>
            <div class="field-row">
              <div class="field-label">描述:</div>
              <textarea class="col-desc" rows="3" placeholder="文物描述">${col.description || ''}</textarea>
            </div>
          </div>
        `).join('');
      }

      // Render workflows editor
      function renderWorkflowsEditor(workflows) {
        const editor = document.getElementById('workflows-editor');
        editor.innerHTML = workflows.map((wf, index) => `
          <div class="array-item" data-index="${index}">
            <div class="array-item-header">
              <strong>路线 #${index + 1}: ${wf.name || '未命名'}</strong>
              <button class="remove-btn" onclick="removeWorkflow(${index})">删除</button>
            </div>
            <div class="field-row">
              <div class="field-label">ID:</div>
              <input type="text" class="wf-id" value="${wf.id || ''}" placeholder="workflow-id" />
            </div>
            <div class="field-row">
              <div class="field-label">名称:</div>
              <input type="text" class="wf-name" value="${wf.name || ''}" placeholder="路线名称" />
            </div>
            <div class="field-row">
              <div class="field-label">描述:</div>
              <textarea class="wf-desc" rows="2" placeholder="路线描述">${wf.description || ''}</textarea>
            </div>
            <div class="field-row">
              <div class="field-label">适用年龄:</div>
              <input type="text" class="wf-ages" value="${(wf.ages || []).join(', ')}" placeholder="例如: 3-6, 7-12, 13-18" />
            </div>
            <div class="hint" style="margin-left:162px">任务数据在JSON编辑模式中编辑</div>
          </div>
        `).join('');
      }

      // Add new collection
      window.addCollection = function() {
        const collections = getCollectionsFromEditor();
        collections.push({ name: '', imageUrl: '', description: '' });
        renderCollectionsEditor(collections);
      };

      // Remove collection
      window.removeCollection = function(index) {
        const collections = getCollectionsFromEditor();
        collections.splice(index, 1);
        renderCollectionsEditor(collections);
      };

      // Add new workflow
      window.addWorkflow = function() {
        const workflows = getWorkflowsFromEditor();
        workflows.push({ id: '', name: '', description: '', ages: [], tasks: [] });
        renderWorkflowsEditor(workflows);
      };

      // Remove workflow
      window.removeWorkflow = function(index) {
        const workflows = getWorkflowsFromEditor();
        workflows.splice(index, 1);
        renderWorkflowsEditor(workflows);
      };

      // Get collections from editor
      function getCollectionsFromEditor() {
        const items = document.querySelectorAll('#collections-editor .array-item');
        return Array.from(items).map(item => ({
          name: item.querySelector('.col-name').value,
          imageUrl: item.querySelector('.col-image').value,
          description: item.querySelector('.col-desc').value
        }));
      }

      // Get workflows from editor
      function getWorkflowsFromEditor() {
        const items = document.querySelectorAll('#workflows-editor .array-item');
        return Array.from(items).map(item => {
          const existingWorkflow = currentData?.workflows?.[item.dataset.index] || {};
          return {
            id: item.querySelector('.wf-id').value,
            name: item.querySelector('.wf-name').value,
            description: item.querySelector('.wf-desc').value,
            ages: item.querySelector('.wf-ages').value.split(',').map(a => a.trim()).filter(a => a),
            tasks: existingWorkflow.tasks || []
          };
        });
      }

      // Build complete data object from editors
      function buildDataFromEditors() {
        const museumId = document.getElementById('museumIdSelect').value === '__new__' 
          ? document.getElementById('customMuseumId').value.trim()
          : document.getElementById('museumIdSelect').value;
        
        return {
          id: museumId,
          name: document.getElementById('edit-name').value.trim(),
          location: document.getElementById('edit-location').value.trim(),
          description: document.getElementById('edit-description').value.trim(),
          tags: document.getElementById('edit-tags').value.split(',').map(t => t.trim()).filter(t => t),
          image: document.getElementById('edit-image').value.trim(),
          collections: getCollectionsFromEditor(),
          workflows: getWorkflowsFromEditor(),
          checklists: currentData?.checklists || { parent: {}, child: {} }
        };
      }

      // Sync from JSON to structured editor
      window.syncFromJson = function() {
        try {
          const jsonData = document.getElementById('museumDataJson').value;
          const parsed = JSON.parse(jsonData);
          currentData = parsed;
          populateEditors(parsed);
          showStatus('已从JSON同步到结构化编辑器', 'success');
        } catch (error) {
          showStatus('JSON格式错误: ' + error.message, 'error');
        }
      };

      // Update preview
      function updatePreview() {
        const data = buildDataFromEditors();
        const preview = document.getElementById('preview-content');
        
        let html = `
          <div class="preview-title">${data.name || '未命名博物馆'}</div>
          <p><strong>位置:</strong> ${data.location || '未设置'}</p>
          <p><strong>标签:</strong> ${data.tags.join(', ') || '无'}</p>
          <p>${data.description || '无描述'}</p>
        `;
        
        if (data.image) {
          html += `<img src="${data.image}" alt="主图" class="preview-image" onerror="this.style.display='none'" />`;
        }
        
        if (data.collections && data.collections.length > 0) {
          html += '<h3>馆藏精品</h3>';
          data.collections.forEach(col => {
            html += `
              <div class="collection-item">
                <div class="collection-name">${col.name}</div>
                ${col.imageUrl ? `<img src="${col.imageUrl}" alt="${col.name}" class="preview-image" onerror="this.style.display='none'" />` : ''}
                <p>${col.description}</p>
              </div>
            `;
          });
        }
        
        if (data.workflows && data.workflows.length > 0) {
          html += '<h3>参观路线</h3>';
          data.workflows.forEach(wf => {
            html += `
              <div class="collection-item">
                <div class="collection-name">${wf.name}</div>
                <p>${wf.description}</p>
                <p><small>适用年龄: ${wf.ages.join(', ')}</small></p>
              </div>
            `;
          });
        }
        
        preview.innerHTML = html;
      }

      // Clear all editors
      function clearEditorsData() {
        currentData = null;
        document.getElementById('edit-name').value = '';
        document.getElementById('edit-location').value = '';
        document.getElementById('edit-description').value = '';
        document.getElementById('edit-image').value = '';
        document.getElementById('edit-tags').value = '';
        document.getElementById('museumDataJson').value = '';
        document.getElementById('collections-editor').innerHTML = '';
        document.getElementById('workflows-editor').innerHTML = '';
        document.getElementById('preview-content').innerHTML = '<p class="hint">加载博物馆数据后可在此预览</p>';
      }

      // Validate data
      window.validateData = function() {
        try {
          const data = buildDataFromEditors();
          
          // Also sync to JSON editor
          document.getElementById('museumDataJson').value = JSON.stringify(data, null, 2);
          
          const required = ['id', 'name', 'location'];
          const missing = required.filter(field => !data[field]);
          
          if (missing.length > 0) {
            showStatus('缺少必需字段: ' + missing.join(', '), 'error');
          } else {
            showStatus('数据验证通过 ✓', 'success');
          }
        } catch (error) {
          showStatus('数据验证错误: ' + error.message, 'error');
        }
      };

      // Submit museum data
      window.submitMuseumData = function() {
        const data = buildDataFromEditors();
        const expireOption = document.getElementById('expireAt').value;

        // Validate
        if (!data.id || !data.name) {
          showStatus('请填写博物馆ID和名称', 'error');
          return;
        }

        // Calculate expiration
        let expireAt = 4866674732; // Default: year 2124
        const now = Math.floor(Date.now() / 1000);
        switch (expireOption) {
          case '1day': expireAt = now + 86400; break;
          case '7days': expireAt = now + 604800; break;
          case '30days': expireAt = now + 2592000; break;
        }

        // Upload
        loader.saveToKVStore(data.id, data, expireAt)
          .then(success => {
            if (success) {
              showStatus('上传成功 ✓', 'success');
              document.getElementById('uploadCard').style.display = 'none';
              loadKVStoreMuseums();
            } else {
              showStatus('上传失败', 'error');
            }
          })
          .catch(error => {
            showStatus('上传失败: ' + error.message, 'error');
          });
      };

      // Show status message
      function showStatus(message, type = 'info') {
        const statusDiv = document.getElementById('statusMsg');
        statusDiv.innerHTML = `<div class="status status-${type}">${message}</div>`;
        setTimeout(() => {
          statusDiv.innerHTML = '';
        }, 5000);
      }

      // Load and display museums in KV store
      async function loadKVStoreMuseums() {
        const listDiv = document.getElementById('museumList');
        listDiv.innerHTML = '<div class="loading">正在加载远程数据...</div>';

        try {
          // Get list of museums from Tier 3 to check
          const allMuseums = await loader.loadAllMuseums();
          currentMuseums = [];

          // Check which museums exist in KV store (Tier 2)
          // Check all museums to ensure none are missed
          for (let i = 0; i < allMuseums.length; i++) {
            const museum = allMuseums[i];
            
            // Update progress indicator
            if (i % 20 === 0) {
              listDiv.innerHTML = `<div class="loading">正在检查远程数据... (${i}/${allMuseums.length})</div>`;
            }
            
            const data = await loader.loadFromTier2(museum.id);
            if (data) {
              currentMuseums.push({
                id: museum.id,
                name: data.name || museum.name,
                location: data.location || museum.location,
                hasData: true
              });
            }
          }

          renderMuseumList();
        } catch (error) {
          console.error('Error loading KV store museums:', error);
          listDiv.innerHTML = `<div class="status status-error">加载失败: ${error.message}</div>`;
        }
      }

      // Render museum list
      function renderMuseumList() {
        const listDiv = document.getElementById('museumList');
        
        if (currentMuseums.length === 0) {
          listDiv.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📦</div>
              <div>远程存储中暂无博物馆数据</div>
              <div class="hint">点击"上传新数据"按钮添加数据</div>
            </div>
          `;
          return;
        }

        listDiv.innerHTML = currentMuseums.map(m => `
          <div class="museum-item">
            <div class="museum-info">
              <div class="museum-name">
                ${m.name}
                <span class="tier-badge tier-2">Tier 2</span>
              </div>
              <div class="museum-meta">ID: ${m.id} • ${m.location || '未知位置'}</div>
            </div>
            <div class="museum-actions">
              <button class="btn btn-secondary btn-sm" onclick="viewMuseum('${m.id}')">查看</button>
              <button class="btn btn-secondary btn-sm" onclick="editMuseum('${m.id}')">编辑</button>
              <button class="btn btn-danger btn-sm" onclick="deleteMuseum('${m.id}')">删除</button>
            </div>
          </div>
        `).join('');
      }

      // View museum data
      window.viewMuseum = async function(museumId) {
        try {
          const data = await loader.loadFromTier2(museumId);
          if (data) {
            const formatted = JSON.stringify(data, null, 2);
            alert('博物馆数据:\n\n' + formatted.substring(0, 500) + '\n\n...(数据已截断)');
          } else {
            showStatus('未找到该博物馆数据', 'error');
          }
        } catch (error) {
          showStatus('加载失败: ' + error.message, 'error');
        }
      };

      // Edit museum data
      window.editMuseum = async function(museumId) {
        document.getElementById('uploadCard').style.display = 'block';
        document.getElementById('museumIdSelect').value = museumId;
        document.getElementById('customIdGroup').style.display = 'none';
        await loadMuseumData(museumId);
        document.getElementById('uploadCard').scrollIntoView({ behavior: 'smooth' });
      };

      // Delete museum data
      window.deleteMuseum = async function(museumId) {
        if (!confirm(`确定要从远程存储删除"${museumId}"吗？\n\n注意：这不会影响静态文件和内置数据。`)) {
          return;
        }

        try {
          const success = await loader.deleteFromKVStore(museumId);
          if (success) {
            showStatus('删除成功', 'success');
            await loadKVStoreMuseums();
          } else {
            showStatus('删除失败', 'error');
          }
        } catch (error) {
          showStatus('删除失败: ' + error.message, 'error');
        }
      };

      // Show upload form
      document.getElementById('uploadBtn').onclick = function() {
        document.getElementById('museumIdSelect').value = '';
        document.getElementById('customIdGroup').style.display = 'none';
        clearEditorsData();
        document.getElementById('uploadCard').style.display = 'block';
        document.getElementById('uploadCard').scrollIntoView({ behavior: 'smooth' });
      };

      // Cancel upload
      document.getElementById('cancelUploadBtn').onclick = function() {
        document.getElementById('uploadCard').style.display = 'none';
      };

      // Refresh button
      document.getElementById('refreshBtn').onclick = loadKVStoreMuseums;

      // Back button
      document.getElementById('backBtn').onclick = function() {
        location.href = 'settings.html';
      };

      // Initial load
      initMuseumSelector();
      loadKVStoreMuseums();
    })();
  </script>
</body>
</html>
