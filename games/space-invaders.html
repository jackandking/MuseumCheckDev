<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>👽 小蜜蜂 - 文物守护者</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        }

        .game-wrapper {
            width: 100vw;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #1a0033 0%, #0d001a 100%);
        }

        /* 顶部状态栏 */
        .header {
            background: rgba(0, 0, 0, 0.9);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #c832ff;
            flex-shrink: 0;
        }

        .game-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .game-title .icon {
            font-size: 24px;
        }

        .game-title .text {
            color: #c832ff;
            font-size: 16px;
            font-weight: bold;
        }

        .stats {
            display: flex;
            gap: 16px;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            color: #888;
            font-size: 10px;
        }

        .stat-value {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }

        /* 游戏画布区域 */
        .game-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0014;
            overflow: hidden;
            min-height: 0;
        }

        #gameCanvas {
            display: block;
            background: #0a0014;
            touch-action: none;
        }

        /* 控制区 */
        .controls {
            background: rgba(0, 0, 0, 0.95);
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            border-top: 2px solid #c832ff;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
        }

        .move-btns {
            display: flex;
            gap: 8px;
        }

        .ctrl-btn {
            width: 56px;
            height: 56px;
            border: 2px solid #c832ff;
            background: rgba(200, 50, 255, 0.2);
            border-radius: 10px;
            color: #c832ff;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
        }

        .ctrl-btn:active {
            background: rgba(200, 50, 255, 0.5);
            transform: scale(0.95);
        }

        .fire-btn {
            width: 70px;
            border-color: #ff6432;
            background: rgba(255, 100, 50, 0.2);
            color: #ff6432;
        }

        .fire-btn:active {
            background: rgba(255, 100, 50, 0.5);
        }

        /* 游戏结束弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-box {
            background: linear-gradient(135deg, #1a0033, #0d001a);
            border: 2px solid #c832ff;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 320px;
            width: 90%;
        }

        .modal-icon {
            font-size: 60px;
            margin-bottom: 16px;
        }

        .modal-title {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .modal-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 24px;
        }

        .modal-stat {
            text-align: center;
        }

        .modal-stat-value {
            color: #c832ff;
            font-size: 28px;
            font-weight: bold;
        }

        .modal-stat-label {
            color: #888;
            font-size: 12px;
        }

        .modal-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #c832ff, #8b32f6);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="header">
            <div class="game-title">
                <span class="icon">👽</span>
                <span class="text">小蜜蜂</span>
            </div>
            <div class="stats">
                <div class="stat">
                    <div class="stat-label">得分</div>
                    <div class="stat-value" id="score">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">生命</div>
                    <div class="stat-value" id="lives">3</div>
                </div>
                <div class="stat">
                    <div class="stat-label">波数</div>
                    <div class="stat-value" id="wave">1</div>
                </div>
            </div>
        </div>

        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="controls">
            <div class="move-btns">
                <div class="ctrl-btn" id="btnLeft">◀</div>
                <div class="ctrl-btn" id="btnRight">▶</div>
            </div>
            <div class="ctrl-btn fire-btn" id="btnFire">🔥</div>
        </div>
    </div>

    <!-- 游戏结束弹窗 -->
    <div class="modal-overlay" id="gameOverModal">
        <div class="modal-box">
            <div class="modal-icon" id="endIcon">💥</div>
            <div class="modal-title" id="endTitle">游戏结束</div>
            <div class="modal-stats">
                <div class="modal-stat">
                    <div class="modal-stat-value" id="finalScore">0</div>
                    <div class="modal-stat-label">得分</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-value" id="finalWave">1</div>
                    <div class="modal-stat-label">波数</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-value" id="finalKills">0</div>
                    <div class="modal-stat-label">击杀</div>
                </div>
            </div>
            <button class="modal-btn" id="btnContinue">继续游览 →</button>
        </div>
    </div>

    <script>
        // Utility function to get app base path for subdirectory deployments (e.g., /MuseumCheckDev/)
        function getAppBasePath() {
            const path = window.location.pathname;
            const pathParts = path.split('/').filter(p => p);
            if (pathParts.length > 0) {
                const firstPart = pathParts[0];
                if (!firstPart.endsWith('.html') && 
                    !['admin', 'quiz', 'survey', 'tests', 'core', 'js', 'css', 'data', 'games', 'assets'].includes(firstPart)) {
                    return '/' + firstPart;
                }
            }
            return '';
        }

        // ============ 游戏配置 ============
        const CONFIG = {
            PLAYER_SPEED: 6,
            BULLET_SPEED: 10,
            ENEMY_BULLET_SPEED: 4,
            FIRE_COOLDOWN: 250,
            ENEMY_FIRE_CHANCE: 0.003,
            INITIAL_LIVES: 3
        };

        // ============ 游戏状态 ============
        let canvas, ctx;
        let gameState = {
            running: false,
            score: 0,
            lives: CONFIG.INITIAL_LIVES,
            wave: 1,
            kills: 0,
            player: null,
            enemies: [],
            playerBullets: [],
            enemyBullets: [],
            explosions: [],
            enemyDirection: 1,
            enemySpeed: 0.8,
            lastFireTime: 0,
            keys: { left: false, right: false },
            animationId: null
        };

        // ============ 初始化 ============
        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            setupControls();
            startGame();
        }

        function resizeCanvas() {
            const gameArea = document.querySelector('.game-area');
            const rect = gameArea.getBoundingClientRect();
            
            // 计算画布尺寸（保持4:5比例）
            const maxWidth = rect.width - 20;
            const maxHeight = rect.height - 20;
            const ratio = 4 / 5;
            
            let width = maxWidth;
            let height = width / ratio;
            
            if (height > maxHeight) {
                height = maxHeight;
                width = height * ratio;
            }
            
            canvas.width = Math.floor(width);
            canvas.height = Math.floor(height);
        }

        function startGame() {
            if (gameState.animationId) {
                cancelAnimationFrame(gameState.animationId);
            }

            gameState = {
                running: true,
                score: 0,
                lives: CONFIG.INITIAL_LIVES,
                wave: 1,
                kills: 0,
                player: {
                    x: canvas.width / 2 - 20,
                    y: canvas.height - 40,
                    width: 40,
                    height: 25,
                    invincible: false,
                    invincibleTime: 0
                },
                enemies: [],
                playerBullets: [],
                enemyBullets: [],
                explosions: [],
                enemyDirection: 1,
                enemySpeed: 0.8,
                lastFireTime: 0,
                keys: { left: false, right: false },
                animationId: null
            };

            createEnemies();
            updateUI();
            document.getElementById('gameOverModal').classList.remove('show');
            
            gameLoop();
        }

        function createEnemies() {
            const rows = 3 + Math.floor(gameState.wave / 2);
            const cols = 6;
            const enemyWidth = 32;
            const enemyHeight = 24;
            const spacing = 10;
            const startX = (canvas.width - (cols * (enemyWidth + spacing))) / 2;
            const startY = 40;
            const colors = ['#FFD700', '#FF6B00', '#FF00FF', '#00FFFF', '#32FF64'];

            gameState.enemies = [];
            for (let row = 0; row < Math.min(rows, 5); row++) {
                for (let col = 0; col < cols; col++) {
                    gameState.enemies.push({
                        x: startX + col * (enemyWidth + spacing),
                        y: startY + row * (enemyHeight + spacing),
                        width: enemyWidth,
                        height: enemyHeight,
                        color: colors[row % colors.length],
                        animFrame: 0,
                        animTimer: 0
                    });
                }
            }
            
            gameState.enemySpeed = 0.8 + gameState.wave * 0.2;
        }

        // ============ 游戏循环 ============
        function gameLoop() {
            if (!gameState.running) return;

            update();
            render();
            gameState.animationId = requestAnimationFrame(gameLoop);
        }

        function update() {
            updatePlayer();
            updateBullets();
            updateEnemies();
            updateExplosions();
            checkCollisions();
            updateUI();
        }

        function updatePlayer() {
            const p = gameState.player;
            
            if (gameState.keys.left) {
                p.x -= CONFIG.PLAYER_SPEED;
            }
            if (gameState.keys.right) {
                p.x += CONFIG.PLAYER_SPEED;
            }
            
            p.x = Math.max(0, Math.min(canvas.width - p.width, p.x));
            
            if (p.invincible) {
                p.invincibleTime--;
                if (p.invincibleTime <= 0) {
                    p.invincible = false;
                }
            }
        }

        function updateBullets() {
            // 玩家子弹
            gameState.playerBullets = gameState.playerBullets.filter(b => {
                b.y -= CONFIG.BULLET_SPEED;
                return b.y > -10;
            });
            
            // 敌人子弹
            gameState.enemyBullets = gameState.enemyBullets.filter(b => {
                b.y += CONFIG.ENEMY_BULLET_SPEED;
                return b.y < canvas.height + 10;
            });
        }

        function updateEnemies() {
            if (gameState.enemies.length === 0) {
                // 下一波
                gameState.wave++;
                createEnemies();
                return;
            }

            let leftMost = canvas.width;
            let rightMost = 0;
            
            gameState.enemies.forEach(e => {
                leftMost = Math.min(leftMost, e.x);
                rightMost = Math.max(rightMost, e.x + e.width);
            });

            let shouldDrop = false;
            if (gameState.enemyDirection > 0 && rightMost >= canvas.width - 5) {
                gameState.enemyDirection = -1;
                shouldDrop = true;
            } else if (gameState.enemyDirection < 0 && leftMost <= 5) {
                gameState.enemyDirection = 1;
                shouldDrop = true;
            }

            gameState.enemies.forEach(e => {
                e.x += gameState.enemySpeed * gameState.enemyDirection;
                if (shouldDrop) e.y += 15;
                
                e.animTimer++;
                if (e.animTimer > 15) {
                    e.animFrame = (e.animFrame + 1) % 2;
                    e.animTimer = 0;
                }

                // 敌人射击
                if (Math.random() < CONFIG.ENEMY_FIRE_CHANCE) {
                    gameState.enemyBullets.push({
                        x: e.x + e.width / 2 - 2,
                        y: e.y + e.height,
                        width: 4,
                        height: 10
                    });
                }

                // 敌人到达底部
                if (e.y + e.height >= gameState.player.y) {
                    endGame(false);
                }
            });
        }

        function updateExplosions() {
            gameState.explosions = gameState.explosions.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.life -= 0.03;
                return p.life > 0;
            });
        }

        function checkCollisions() {
            const p = gameState.player;

            // 玩家子弹 vs 敌人
            for (let i = gameState.playerBullets.length - 1; i >= 0; i--) {
                const bullet = gameState.playerBullets[i];
                for (let j = gameState.enemies.length - 1; j >= 0; j--) {
                    const enemy = gameState.enemies[j];
                    if (isColliding(bullet, enemy)) {
                        createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, enemy.color);
                        gameState.score += 10;
                        gameState.kills++;
                        gameState.playerBullets.splice(i, 1);
                        gameState.enemies.splice(j, 1);
                        break;
                    }
                }
            }

            // 敌人子弹 vs 玩家
            if (!p.invincible) {
                for (let i = gameState.enemyBullets.length - 1; i >= 0; i--) {
                    if (isColliding(gameState.enemyBullets[i], p)) {
                        gameState.enemyBullets.splice(i, 1);
                        handlePlayerHit();
                        break;
                    }
                }
            }
        }

        function isColliding(a, b) {
            return a.x < b.x + b.width &&
                   a.x + a.width > b.x &&
                   a.y < b.y + b.height &&
                   a.y + a.height > b.y;
        }

        function handlePlayerHit() {
            gameState.lives--;
            createExplosion(
                gameState.player.x + gameState.player.width / 2,
                gameState.player.y + gameState.player.height / 2,
                '#00FF00'
            );

            if (gameState.lives <= 0) {
                endGame(false);
                return;
            }

            gameState.player.invincible = true;
            gameState.player.invincibleTime = 90;
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 10; i++) {
                const angle = (Math.PI * 2 * i) / 10;
                const speed = Math.random() * 3 + 1;
                gameState.explosions.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function firePlayerBullet() {
            if (!gameState.running) return;
            
            const now = Date.now();
            if (now - gameState.lastFireTime < CONFIG.FIRE_COOLDOWN) return;
            if (gameState.playerBullets.length >= 5) return;

            gameState.lastFireTime = now;
            gameState.playerBullets.push({
                x: gameState.player.x + gameState.player.width / 2 - 2,
                y: gameState.player.y,
                width: 4,
                height: 12
            });
        }

        // ============ 渲染 ============
        function render() {
            ctx.fillStyle = '#0a0014';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 星星背景
            ctx.fillStyle = '#FFF';
            for (let i = 0; i < 30; i++) {
                const x = (i * 37 + gameState.score) % canvas.width;
                const y = (i * 23) % canvas.height;
                ctx.fillRect(x, y, 1, 1);
            }

            // 玩家
            const p = gameState.player;
            if (!p.invincible || Math.floor(p.invincibleTime / 4) % 2 === 0) {
                ctx.fillStyle = '#00FF00';
                ctx.beginPath();
                ctx.moveTo(p.x + p.width / 2, p.y);
                ctx.lineTo(p.x + p.width, p.y + p.height);
                ctx.lineTo(p.x + p.width * 0.7, p.y + p.height * 0.7);
                ctx.lineTo(p.x + p.width * 0.3, p.y + p.height * 0.7);
                ctx.lineTo(p.x, p.y + p.height);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#00CCFF';
                ctx.beginPath();
                ctx.arc(p.x + p.width / 2, p.y + p.height * 0.4, p.width * 0.1, 0, Math.PI * 2);
                ctx.fill();
            }

            // 玩家子弹
            ctx.fillStyle = '#FFFF00';
            ctx.shadowColor = '#FFFF00';
            ctx.shadowBlur = 8;
            gameState.playerBullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));
            ctx.shadowBlur = 0;

            // 敌人子弹
            ctx.fillStyle = '#FF0000';
            ctx.shadowColor = '#FF0000';
            ctx.shadowBlur = 8;
            gameState.enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));
            ctx.shadowBlur = 0;

            // 敌人
            gameState.enemies.forEach(e => drawEnemy(e));

            // 爆炸
            gameState.explosions.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });
        }

        function drawEnemy(e) {
            ctx.shadowColor = e.color;
            ctx.shadowBlur = 6;

            // 身体
            ctx.fillStyle = e.color;
            ctx.beginPath();
            ctx.ellipse(e.x + e.width / 2, e.y + e.height / 2, e.width / 2.5, e.height / 2.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // 条纹
            ctx.fillStyle = '#000';
            ctx.fillRect(e.x + e.width * 0.25, e.y + e.height * 0.35, e.width * 0.5, e.height * 0.08);
            ctx.fillRect(e.x + e.width * 0.2, e.y + e.height * 0.5, e.width * 0.6, e.height * 0.08);

            // 翅膀
            const wingAngle = e.animFrame === 0 ? 0.3 : -0.3;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.beginPath();
            ctx.ellipse(e.x + e.width * 0.15, e.y + e.height * 0.3, e.width * 0.18, e.height * 0.1, wingAngle, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(e.x + e.width * 0.85, e.y + e.height * 0.3, e.width * 0.18, e.height * 0.1, -wingAngle, 0, Math.PI * 2);
            ctx.fill();

            // 眼睛
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.arc(e.x + e.width * 0.35, e.y + e.height * 0.35, e.width * 0.06, 0, Math.PI * 2);
            ctx.arc(e.x + e.width * 0.65, e.y + e.height * 0.35, e.width * 0.06, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
        }

        // ============ UI更新 ============
        function updateUI() {
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('lives').textContent = gameState.lives;
            document.getElementById('wave').textContent = gameState.wave;
        }

        function endGame(victory) {
            gameState.running = false;
            if (gameState.animationId) {
                cancelAnimationFrame(gameState.animationId);
            }

            if (victory) gameState.score += 100;

            document.getElementById('finalScore').textContent = gameState.score;
            document.getElementById('finalWave').textContent = gameState.wave;
            document.getElementById('finalKills').textContent = gameState.kills;
            document.getElementById('endIcon').textContent = victory ? '🎉' : '💥';
            document.getElementById('endTitle').textContent = victory ? '防卫成功！' : '游戏结束';

            document.getElementById('gameOverModal').classList.add('show');
        }

        // ============ 控制 ============
        function setupControls() {
            const btnLeft = document.getElementById('btnLeft');
            const btnRight = document.getElementById('btnRight');
            const btnFire = document.getElementById('btnFire');

            // 触摸控制
            btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); gameState.keys.left = true; });
            btnLeft.addEventListener('touchend', () => { gameState.keys.left = false; });
            btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); gameState.keys.right = true; });
            btnRight.addEventListener('touchend', () => { gameState.keys.right = false; });
            btnFire.addEventListener('touchstart', (e) => { e.preventDefault(); firePlayerBullet(); });

            // 鼠标控制
            btnLeft.addEventListener('mousedown', () => { gameState.keys.left = true; });
            btnLeft.addEventListener('mouseup', () => { gameState.keys.left = false; });
            btnLeft.addEventListener('mouseleave', () => { gameState.keys.left = false; });
            btnRight.addEventListener('mousedown', () => { gameState.keys.right = true; });
            btnRight.addEventListener('mouseup', () => { gameState.keys.right = false; });
            btnRight.addEventListener('mouseleave', () => { gameState.keys.right = false; });
            btnFire.addEventListener('click', firePlayerBullet);

            // 键盘控制
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') gameState.keys.left = true;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') gameState.keys.right = true;
                if (e.key === ' ') { e.preventDefault(); firePlayerBullet(); }
            });
            document.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') gameState.keys.left = false;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') gameState.keys.right = false;
            });

            // 继续游览按钮 (使用 getAppBasePath 支持子目录部署)
            document.getElementById('btnContinue').addEventListener('click', () => {
                window.location.href = getAppBasePath() + '/museum-checkin.html';
            });
        }

        // 启动游戏
        window.addEventListener('load', init);
    </script>
</body>
</html>
